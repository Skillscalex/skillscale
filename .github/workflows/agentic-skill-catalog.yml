name: Agentic Skill Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ingest and publish catalog
        run: npm run autonomous:skills:publish -- --ingest-live --allow-external-fetch --live
        env:
          SKILLS_SH_BEARER_TOKEN: ${{ secrets.SKILLS_SH_BEARER_TOKEN }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
      - name: Generate public Pages Supabase config when env is present
        run: npm run pages:auth-config
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Open catalog update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- docs/data/auth-config.json docs/data/skills-catalog.json docs/data/occupation-counts.json docs/data/skills-index)" ]; then
            echo "No catalog changes"
            exit 0
          fi
          branch="automation/agentic-skill-catalog-${GITHUB_RUN_ID}"
          git config user.name "skillscale-agent"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          git add -A -- docs/data
          git commit -m "Update agentic skill catalog"
          git push --set-upstream origin "$branch"
          if gh pr create \
            --title "Update agentic skill catalog" \
            --body "Automated catalog refresh from workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
            --base main \
            --head "$branch" \
            --label agentic-delivery \
            --label automation; then
            echo "Catalog update PR opened."
          else
            echo "Catalog branch pushed but PR creation is blocked by repository/organization Actions permissions."
            echo "Open manually or via Hermes governor: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/new/${branch}"
          fi
