name: Agentic Skill Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  publish-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ingest and publish catalog
        run: npm run autonomous:skills:publish -- --ingest-live --allow-external-fetch --live
        env:
          SKILLS_SH_BEARER_TOKEN: ${{ secrets.SKILLS_SH_BEARER_TOKEN }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
      - name: Commit catalog updates
        run: |
          if [ -z "$(git status --porcelain -- docs/data/skills-catalog.json docs/data/occupation-counts.json docs/data/skills-index)" ]; then
            echo "No catalog changes"
            exit 0
          fi
          git config user.name "skillscale-agent"
          git config user.email "actions@github.com"
          git add docs/data/skills-catalog.json docs/data/occupation-counts.json docs/data/skills-index
          git commit -m "Update agentic skill catalog"
          git push
