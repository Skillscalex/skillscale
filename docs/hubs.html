/* ====================================================
   Vault helpers
   ==================================================== */
const VAULT_KEY = 'skillscale_vault';
function getVault() {
  try { return JSON.parse(localStorage.getItem(VAULT_KEY) || '{"dreamed":[],"owned":[]}'); }
  catch { return { dreamed:[], owned:[] }; }
}
function getVaultCount() { const v = getVault(); return v.dreamed.length + v.owned.length; }

/* ====================================================
   Shared: ThemeToggle
   ==================================================== */
function ThemeToggle({ theme, onToggle }) {
  return (
    <button onClick={onToggle} className="lg"
      style={{ width:38, height:38, borderRadius:'50%', border:'none', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, color: theme==='light'?'#1A1714':'#F1E9D8', cursor:'pointer', flexShrink:0 }}>
      {theme==='light'?'☀️':'🌙'}
    </button>
  );
}

/* ====================================================
   Nav
   ==================================================== */
function Nav({ theme, onToggle }) {
  const [vaultCount, setVaultCount] = useState(getVaultCount);
  const pages = [
    {href:'skills.html',label:'Skills'},{href:'market.html',label:'Market'},
    {href:'community.html',label:'Community'},{href:'mcps.html',label:'MCPs'},
  ];
  useEffect(() => {
    function sync() { setVaultCount(getVaultCount()); }
    window.addEventListener('vault-updated', sync);
    window.addEventListener('storage', sync);
    return () => { window.removeEventListener('vault-updated', sync); window.removeEventListener('storage', sync); };
  }, []);
  return (
    <nav className="nav lg" style={{ padding:'12px 24px', borderBottom:'1px solid var(--border)', borderRadius:0 }}>
      <div className="nav-inner">
        <a href="index.html" style={{ fontFamily:'Archivo Black', fontSize:'1.05rem', color:'var(--text)', letterSpacing:'-.01em', flexShrink:0 }}>
          skill<span style={{ color:'var(--accent)' }}>scale</span>
        </a>
        <div className="nav-links" style={{ display:'flex', alignItems:'center', padding:'6px', borderRadius:9999, gap:2 }}>
          {pages.map(p => (
            <a key={p.href} href={p.href} style={{ fontFamily:'JetBrains Mono', fontSize:'.72rem', letterSpacing:'.04em', padding:'6px 14px', borderRadius:9999, color:'var(--text-2)', background:'transparent', transition:'all 0.15s' }}>
              {p.label}
            </a>
          ))}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <a href="vault.html" style={{ position:'relative', display:'flex', alignItems:'center', gap:6, fontFamily:'JetBrains Mono', fontSize:'.72rem', padding:'7px 14px', borderRadius:9999, color:'var(--text-2)', border:'1px solid var(--border)', transition:'all 0.15s', textDecoration:'none' }}>
            ✦ Vault
            {vaultCount > 0 && (
              <span style={{ position:'absolute', top:-5, right:-5, minWidth:16, height:16, borderRadius:9999, background:'var(--accent)', color:'#fff', fontSize:'.55rem', fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', padding:'0 4px' }}>
                {vaultCount}
              </span>
            )}
          </a>
          <a href="hubs.html" style={{ display:'flex', alignItems:'center', gap:6, fontFamily:'JetBrains Mono', fontSize:'.72rem', padding:'7px 14px', borderRadius:9999, color:'var(--accent)', background:'rgba(212,102,26,0.08)', border:'1px solid rgba(212,102,26,0.3)', transition:'all 0.15s', textDecoration:'none' }}>
            ⬡ Hubs
          </a>
          <a href="auth.html" className="btn btn-sm lg" style={{ fontFamily:'JetBrains Mono', fontSize:'.72rem', padding:'7px 16px', border:'1px solid var(--border)' }}>
            Sign In
          </a>
          <ThemeToggle theme={theme} onToggle={onToggle} />
        </div>
      </div>
    </nav>
  );
}

/* ====================================================
   Hub Cover Generator
   ==================================================== */
function HubCover({ hub, height=118 }) {
  return (
    <div
      className={`hub-cover ${hub.coverPattern}`}
      style={{
        height,
        background: `linear-gradient(135deg, ${hub.coverColor}ee 0%, ${hub.coverColor}99 60%, ${hub.coverColor}66 100%)`,
      }}
    >
      {/* Floating name watermark */}
      <div style={{
        position:'absolute', bottom:12, left:16, right:16,
        display:'flex', alignItems:'flex-end', justifyContent:'space-between'
      }}>
        <span style={{ fontFamily:'Archivo Black', fontSize:'1.05rem', color:'rgba(255,255,255,0.92)', letterSpacing:'-.01em', lineHeight:1, textShadow:'0 1px 8px rgba(0,0,0,0.25)' }}>
          {hub.name}
        </span>
        {hub.verified && (

/* ====================================================
   Hub Card (grid)
   ==================================================== */
function HubCard({ hub, index, onOpen }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once:true, margin:'0px' });
  const [following, setFollowing] = useState(() => {
    try { return JSON.parse(localStorage.getItem(`hub-follow-${hub.id}`) || 'false'); }
    catch { return false; }
  });
  const typeCfg = TYPE_CONFIG[hub.type] || TYPE_CONFIG.community;
  const followerStr = hub.followers >= 1000 ? `${(hub.followers/1000).toFixed(1)}k` : hub.followers;

  function toggleFollow(e) {
    e.stopPropagation();
    const next = !following;
    setFollowing(next);
    localStorage.setItem(`hub-follow-${hub.id}`, JSON.stringify(next));
  }

  return (
    <motion.div
      ref={ref}
      className="hub-card"
      onClick={() => onOpen(hub)}
      initial={{ opacity:0, y:20 }}
      animate={inView ? { opacity:1, y:0 } : {}}
      transition={{ duration:0.4, delay: Math.min(index*0.06, 0.4), ease:'easeOut' }}
    >
      <HubCover hub={hub} height={118} />

      <div style={{ padding:'16px 18px 18px', display:'flex', flexDirection:'column', gap:12, flex:1 }}>
        {/* Identity row */}
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:10 }}>
          <div>
            <div style={{ display:'flex', alignItems:'center', gap:7, flexWrap:'wrap', marginBottom:4 }}>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'var(--text-2)' }}>@{hub.creator}</span>
              {hub.verified && <span className="hub-verified">✓ Verified</span>}
              <span className="hub-type-badge" style={{ background: typeCfg.bg, color: typeCfg.color, borderColor: typeCfg.color + '30' }}>
                {typeCfg.label}
              </span>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:'.6rem', color:'var(--text-2)' }}>
                {hub.skillCount >= 1000000 ? `${(hub.skillCount/1000000).toFixed(1)}M` : hub.skillCount} skills
              </span>
              <span style={{ width:2, height:2, borderRadius:'50%', background:'var(--border)' }} />

/* ====================================================
   Main App
   ==================================================== */
function App() {
  const [theme, setTheme] = useState(() => {
    const s = localStorage.getItem('sk-theme');
    if (s) return s;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });
  const [activeFilter, setActiveFilter] = useState('all');
  const [searchQ, setSearchQ] = useState('');
  const [openHub, setOpenHub] = useState(null);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('sk-theme', theme);
  }, [theme]);

  useEffect(() => {
    document.body.style.overflow = openHub ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [openHub]);

  const FILTERS = [
    { id:'all',       label:'All' },
    { id:'packs',     label:'Packs' },
    { id:'official',  label:'Official' },
    { id:'creator',   label:'Creator' },
    { id:'themed',    label:'Themed' },
    { id:'community', label:'Community' },
  ];

  const filtered = HUBS.filter(h => {
    const matchFilter = activeFilter === 'all'
      || (activeFilter === 'packs' && (h.type === 'community' || h.type === 'creator'))
      || h.type === activeFilter;
    const q = searchQ.toLowerCase().trim();
    const matchSearch = !q ||
      h.name.toLowerCase().includes(q) ||
      h.description.toLowerCase().includes(q) ||
      h.creator.toLowerCase().includes(q) ||
      h.tags.some(t => t.toLowerCase().includes(q));
    return matchFilter && matchSearch;
  });

  const nonFeatured = filtered.filter(h => !h.featured || activeFilter !== 'all' || searchQ);
  const showFeatured = activeFilter === 'all' && !searchQ;
  const isPacksFilter = activeFilter === 'packs';

  return (
    <>
      <Nav theme={theme} onToggle={() => setTheme(t => t==='light'?'dark':'light')} />
      <HubDetailPanel hub={openHub} onClose={() => setOpenHub(null)} />

      <main style={{ background:'var(--bg)', minHeight:'100vh' }}>
        <HeroSection searchQ={searchQ} setSearchQ={setSearchQ} />
        <StatsStrip />

        <div className="section-sm" style={{ background:'var(--bg)' }}>
          <div className="container">
            {/* Featured section */}
            {showFeatured && <FeaturedHubs hubs={HUBS} onOpen={setOpenHub} />}

            {/* Filter tabs */}
            <div style={{ display:'flex', alignItems:'center', gap:6, marginBottom:32, overflowX:'auto', paddingBottom:4 }}>
              {FILTERS.map(f => (
                <button key={f.id} className={`hub-tab${activeFilter===f.id?' active':''}`} onClick={() => setActiveFilter(f.id)}>
                  {f.label}
                  <span style={{ marginLeft:6, fontFamily:'JetBrains Mono', fontSize:'.58rem',
                    color: activeFilter===f.id ? 'rgba(255,255,255,0.65)' : 'var(--text-2)' }}>
                    {f.id==='all' ? HUBS.length : f.id==='packs' ? HUBS.filter(h=>h.type==='community'||h.type==='creator').length : HUBS.filter(h=>h.type===f.id).length}
                  </span>
                </button>
              ))}
            </div>

            {/* Grid */}
            {nonFeatured.length === 0 && filtered.length === 0 ? (
              <div style={{ textAlign:'center', padding:'60px 0' }}>
                <p style={{ fontFamily:'JetBrains Mono', fontSize:'.85rem', color:'var(--text-2)' }}>No hubs match your search.</p>
              </div>
            ) : (
              <>
                {(nonFeatured.length > 0 || !showFeatured) && (
                  <>
                    {(showFeatured || isPacksFilter) && (
                      <div style={{ marginBottom: isPacksFilter ? 28 : 20 }}>
                        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom: isPacksFilter ? 8 : 0 }}>
                          <span style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', letterSpacing:'.08em', color:'var(--accent)', textTransform:'uppercase' }}>// Packs</span>
                          <div style={{ flex:1, height:1, background:'var(--border)' }} />
                        </div>
                        {isPacksFilter && (
                          <p style={{ fontFamily:'DM Sans', fontSize:'.85rem', color:'var(--text-2)', margin:'8px 0 0', lineHeight:1.55 }}>
                            Curated collections built by creators and community members — themed, focused, and ready to use.
                          </p>
                        )}
                      </div>
                    )}
                    <div className="grid-3">
                      {(showFeatured ? nonFeatured : filtered).map((hub, i) => (
                        <HubCard key={hub.id} hub={hub} index={i} onOpen={setOpenHub} />
                      ))}
                    </div>
                  </>
                )}
              </>
            )}

            {/* CTA */}
            <motion.div
              initial={{ opacity:0, y:20 }}
              whileInView={{ opacity:1, y:0 }}
              viewport={{ once:true }}
              transition={{ duration:0.5 }}
              className="lg"
              style={{ marginTop:56, padding:'40px 36px', borderRadius:24, textAlign:'center', background:'linear-gradient(135deg,rgba(212,102,26,0.08) 0%,transparent 60%)' }}
            >
              <span style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', letterSpacing:'.08em', color:'var(--accent)', textTransform:'uppercase', display:'block', marginBottom:12 }}>
                // Create a Hub
              </span>
              <h2 className="t-display" style={{ fontSize:'clamp(1.8rem,4vw,3rem)', color:'var(--text)', marginBottom:14 }}>
                Share your stack
              </h2>
              <p style={{ fontFamily:'DM Sans', fontSize:'.95rem', color:'var(--text-2)', lineHeight:1.6, maxWidth:'46ch', margin:'0 auto 28px' }}>
                Package your favourite skills into a Hub and share them with the Skillscale community. One link, all your tools.
              </p>
              <a href="auth.html" className="btn btn-primary btn-lg" style={{ fontFamily:'JetBrains Mono' }}>
                Create a Hub →
              </a>
            </motion.div>
          </div>
        </div>
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
