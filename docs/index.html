<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
const { motion, AnimatePresence, useInView } = window.Motion;

/* ====================================================
   FadingVideo — rAF-driven crossfade loop
   (no CSS transitions — exactly as in the spec)
   ==================================================== */
const FADE_MS = 500;
const FADE_OUT_LEAD = 0.55;

function FadingVideo({ src, className, style }) {
  const videoRef = useRef(null);
  const rafRef   = useRef(null);
  const fadingOutRef = useRef(false);

  const fadeTo = useCallback((target, durationMs) => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const el    = videoRef.current;
    if (!el) return;
    const start = parseFloat(el.style.opacity) || 0;
    const diff  = target - start;
    const t0    = performance.now();
    function step(now) {
      const t = Math.min((now - t0) / durationMs, 1);
      el.style.opacity = String(start + diff * t);
      if (t < 1) rafRef.current = requestAnimationFrame(step);
    }
    rafRef.current = requestAnimationFrame(step);
  }, []);

  useEffect(() => {
    const el = videoRef.current;
    if (!el) return;
    el.style.opacity = '0';

    const onLoaded = () => {
      el.style.opacity = '0';
      el.play().catch(()=>{});
      fadeTo(1, FADE_MS);
    };
    const onTimeUpdate = () => {
      if (!fadingOutRef.current && el.duration && (el.duration - el.currentTime) <= FADE_OUT_LEAD && (el.duration - el.currentTime) > 0) {
        fadingOutRef.current = true;
        fadeTo(0, FADE_MS);
      }
    };
    const onEnded = () => {
      el.style.opacity = '0';
      setTimeout(() => {
        el.currentTime = 0;
        el.play().catch(()=>{});
        fadingOutRef.current = false;
        fadeTo(1, FADE_MS);
      }, 100);
    };

    el.addEventListener('loadeddata', onLoaded);
    el.addEventListener('timeupdate', onTimeUpdate);
    el.addEventListener('ended', onEnded);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      el.removeEventListener('loadeddata', onLoaded);
      el.removeEventListener('timeupdate', onTimeUpdate);
      el.removeEventListener('ended', onEnded);
    };
  }, [fadeTo]);

  return (
    <video
      ref={videoRef}
      autoPlay muted playsInline preload="auto"
      style={{ opacity: 0, ...style }}
      className={className}
    >
      <source src={src} type="video/mp4" />
    </video>
  );
}

/* ====================================================
   BlurText — word-by-word blur-in animation
   ==================================================== */
function BlurText({ text, className, style }) {
  const ref   = useRef(null);
  const inView = useInView(ref, { once: true, margin: '-10%' });
  const words = text.split(' ');

  return (
    <p ref={ref} style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em', ...style }} className={className}>
      {words.map((word, i) => (
        <motion.span
          key={i}
          style={{ display: 'inline-block', marginRight: '0.28em' }}
          initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
          animate={inView ? [
            { filter: 'blur(5px)',  opacity: 0.5, y: -5 },
            { filter: 'blur(0px)',  opacity: 1,   y: 0  },
          ] : {}}
          transition={{ duration: 0.7, delay: (i * 100) / 1000, ease: 'easeOut', times: [0.5, 1] }}
        >
          {word}
        </motion.span>
      ))}
    </p>
  );
}

}

/* ====================================================
   RecommendedSection — localStorage-based personalization
   ==================================================== */
function RecommendedSection() {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, margin: '-10%' });
  const [recs, setRecs] = useState([]);

  useEffect(() => {
    const viewed = JSON.parse(localStorage.getItem('sk-viewed-occs') || '[]');
    const queries = viewed.length > 0
      ? ['data analysis', 'machine learning', 'automation']
      : ['productivity', 'writing', 'research'];

    Promise.all(queries.slice(0,2).map(q =>
      fetch(`/api/v1/skills/search?q=${encodeURIComponent(q)}&limit=3&page=1`)
        .then(r => r.json())
        .then(d => d.success ? (d.data?.skills || []) : [])
        .catch(() => [])
    )).then(results => {
      const all = results.flat().slice(0,6);
      if (all.length > 0) setRecs(all);
    });
  }, []);

  const fallback = [
    { id:'r1', name:'web-scraper', author:'priya_r', stars:122, description:'JS-aware scraper that handles SPAs and dynamic content.' },
    { id:'r2', name:'email-assistant', author:'oscar_t', stars:98, description:'Draft, summarize, and schedule emails from natural language.' },
    { id:'r3', name:'data-cleaner', author:'dev_kai', stars:87, description:'Automated data validation, deduplication, and formatting.' },
    { id:'r4', name:'claude-summarizer', author:'mia_dev', stars:76, description:'Summarize documents, threads, and codebases with structure.' },
    { id:'r5', name:'notion-sync', author:'alex_m', stars:134, description:'Bi-directional sync between Claude context and Notion.' },
    { id:'r6', name:'github-pr-helper', author:'tomasz_w', stars:156, description:'Automated PR descriptions, review checklists, changelogs.' },
  ];
  const display = recs.length > 0 ? recs : fallback;

  return (
    <section className="section-sm page-bg" ref={ref} style={{ background:'var(--bg-1, var(--bg))', borderTop:'1px solid var(--border)' }}>
      <div className="container">
        <motion.div initial={{ opacity:0, y:20 }} animate={inView ? { opacity:1, y:0 } : {}} transition={{ duration:0.5, ease:'easeOut' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:24, flexWrap:'wrap', gap:12 }}>
            <div>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', letterSpacing:'.08em', color:'var(--accent)', textTransform:'uppercase', display:'block', marginBottom:8 }}>// For You</span>
              <h2 className="t-heading" style={{ fontSize:'clamp(1.5rem,3vw,2.2rem)', color:'var(--text)', margin:0 }}>Recommended for you</h2>
            </div>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:'.62rem', color:'var(--text-2)' }}>Based on your browsing</span>
          </div>
          <div style={{ display:'flex', gap:12, overflowX:'auto', paddingBottom:8 }}>
            {display.map((s, i) => (
              <motion.a
                key={s.id} href="skills.html"
                initial={{ opacity:0, x:16 }} animate={inView ? { opacity:1, x:0 } : {}}
                transition={{ duration:0.4, delay:i*0.07, ease:'easeOut' }}
                className="lg"
                style={{ flexShrink:0, width:220, display:'flex', flexDirection:'column', gap:10, padding:'14px 16px', borderRadius:14, border:'1px solid var(--border)', textDecoration:'none', cursor:'pointer' }}
                whileHover={{ scale:1.02 }}
              >
                <img src={`https://api.dicebear.com/7.x/shapes/svg?seed=${encodeURIComponent(s.name)}`} alt="" width={40} height={40} style={{ borderRadius:10 }} />
                <div>
                  <span style={{ fontFamily:'JetBrains Mono', fontSize:'.7rem', color:'var(--text)', fontWeight:500, display:'block', marginBottom:4 }}>{s.name}</span>
                  <p style={{ fontFamily:'DM Sans', fontSize:'.78rem', color:'var(--text-2)', margin:0, lineHeight:1.45, overflow:'hidden', display:'-webkit-box', WebkitLineClamp:3, WebkitBoxOrient:'vertical' }}>
                    {s.description || s.desc || ''}
                  </p>
                </div>
                <div style={{ marginTop:'auto', display:'flex', alignItems:'center', gap:8 }}>
                  <span style={{ fontFamily:'JetBrains Mono', fontSize:'.6rem', color:'var(--text-2)' }}>★ {s.stars}</span>

                </div>

            ))}

        </motion.div>
      </div>
    </section>
  );
}

/* ====================================================
   App
   ==================================================== */
function App() {
  const [theme, setTheme] = useState(() => {
    const stored = localStorage.getItem('sk-theme');
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('sk-theme', theme);
  }, [theme]);

  const toggleTheme = () => setTheme(t => t === 'light' ? 'dark' : 'light');

  return (
    <>
      <Nav theme={theme} onToggle={toggleTheme} currentPage="index.html" />
      <HeroSection />
      <FeaturesSection />
      <HowSection />
      <TrendingSection />
      <RecommendedSection />
      <CTASection />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
