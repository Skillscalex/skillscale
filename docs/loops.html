<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Discover and share open-source AI agent loops, routines, and repeatable workflows with explicit verification and stopping conditions." />
  <title>Loops & Routines: Skillscale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo+Black&family=DM+Sans:opsz,wght@9..40,300..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { display:['Instrument Serif','serif'], heading:['Archivo Black','sans-serif'], body:['DM Sans','sans-serif'], mono:['JetBrains Mono','monospace'] } } }
    };
  </script>
  <style>
    #root { min-height:100vh; }
    .loops-page { min-height:100vh; background:var(--bg); color:var(--text); }
    .loops-hero { position:relative; padding:150px 24px 72px; overflow:hidden; border-bottom:1px solid var(--border); }
    .loops-hero::before { content:""; position:absolute; width:560px; height:560px; right:-100px; top:-140px; border-radius:50%; background:radial-gradient(circle, rgba(212,102,26,.16), transparent 68%); pointer-events:none; }
    .loop-orbit { position:absolute; right:max(6vw,24px); top:132px; width:250px; height:250px; border:1px solid var(--border); border-radius:50%; opacity:.9; }
    .loop-orbit::before,.loop-orbit::after { content:""; position:absolute; inset:27px; border:1px dashed rgba(212,102,26,.35); border-radius:50%; }
    .loop-orbit::after { inset:76px; border-style:solid; background:rgba(212,102,26,.06); }
    .orbit-node { position:absolute; width:42px; height:42px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--bg); border:1px solid var(--border); box-shadow:var(--glass-shadow); font-family:'JetBrains Mono'; font-size:.7rem; color:var(--accent); z-index:2; }
    .orbit-node:nth-child(1){left:-21px;top:102px}.orbit-node:nth-child(2){right:10px;top:18px}.orbit-node:nth-child(3){right:-10px;bottom:34px}.orbit-node:nth-child(4){left:76px;bottom:-20px}
    .filter-shell { position:sticky; top:62px; z-index:50; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); }
    .filter-row { max-width:1200px; margin:0 auto; padding:16px 24px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .loop-search { flex:1; min-width:250px; border:1px solid var(--border); background:var(--bg-1); color:var(--text); border-radius:9999px; padding:11px 18px; font:400 .78rem 'JetBrains Mono'; outline:none; }
    .loop-search:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(212,102,26,.09); }
    .filter-select { border:1px solid var(--border); background:var(--bg-1); color:var(--text); border-radius:9999px; padding:10px 32px 10px 14px; font:400 .68rem 'JetBrains Mono'; outline:none; }
    .market-wrap { max-width:1200px; margin:0 auto; padding:48px 24px 88px; }
    .market-head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .routine-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .routine-card { border:1px solid var(--border); border-radius:18px; padding:20px; background:var(--bg-1); min-height:330px; display:flex; flex-direction:column; cursor:pointer; transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease; }
    .routine-card:hover { transform:translateY(-3px); border-color:rgba(212,102,26,.34); box-shadow:0 14px 38px rgba(23,17,12,.08); }
    [data-theme="dark"] .routine-card:hover { box-shadow:0 14px 38px rgba(0,0,0,.3); }
    .routine-flow { display:flex; align-items:center; margin:18px 0; }
    .flow-node { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--bg); border:1px solid var(--border); color:var(--accent); font:600 .64rem 'JetBrains Mono'; }
    .flow-line { height:1px; flex:1; background:linear-gradient(90deg,var(--border),var(--accent),var(--border)); opacity:.75; }
    .chip { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:9999px; padding:4px 9px; color:var(--text-2); font:400 .61rem 'JetBrains Mono'; }
    .routine-actions { display:flex; gap:8px; margin-top:auto; padding-top:18px; }
    .routine-button { flex:1; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:9999px; padding:8px 12px; font:500 .65rem 'JetBrains Mono'; cursor:pointer; }
    .routine-button.primary { background:var(--text); color:var(--bg); border-color:var(--text); }
    .routine-button.saved { color:var(--accent); border-color:rgba(212,102,26,.35); }
    .source-section { border-top:1px solid var(--border); background:var(--bg-1); padding:78px 24px; }
    .source-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-top:28px; }
    .source-card { display:flex; flex-direction:column; min-height:230px; padding:20px; background:var(--bg); border:1px solid var(--border); border-radius:16px; }
    .source-mark { width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(212,102,26,.1);color:var(--accent);font:700 .78rem 'JetBrains Mono';margin-bottom:18px; }
    .empty-state { grid-column:1/-1; padding:64px 24px; text-align:center; border:1px dashed var(--border); border-radius:18px; color:var(--text-2); }
    .modal-backdrop { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(8,7,6,.62); backdrop-filter:blur(8px); }
    .loop-modal { width:min(720px,100%); max-height:88vh; overflow:auto; border-radius:22px; border:1px solid var(--border); background:var(--bg); color:var(--text); box-shadow:0 30px 100px rgba(0,0,0,.32); }
    .modal-head { position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; gap:20px; padding:24px; border-bottom:1px solid var(--border); background:var(--bg); }
    .modal-body { padding:24px; }
    .detail-block { padding:16px 18px; border:1px solid var(--border); border-radius:14px; background:var(--bg-1); margin-top:14px; }
    .detail-label { display:block; color:var(--accent); font:500 .62rem 'JetBrains Mono'; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px; }
    .close-button { width:34px;height:34px;flex-shrink:0;border:1px solid var(--border);border-radius:50%;background:var(--bg-1);color:var(--text);font-size:18px; }
    .submit-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .field { display:flex; flex-direction:column; gap:7px; color:var(--text-2); font:500 .63rem 'JetBrains Mono'; }
    .field.full { grid-column:1/-1; }
    .field input,.field textarea,.field select { width:100%; border:1px solid var(--border); border-radius:12px; background:var(--bg-1); color:var(--text); padding:11px 13px; font:400 .8rem 'DM Sans'; outline:none; }
    .field textarea { min-height:96px; resize:vertical; }
    .toast-loop { position:fixed; right:24px; bottom:24px; z-index:300; background:var(--text); color:var(--bg); border-radius:9999px; padding:11px 18px; font:500 .68rem 'JetBrains Mono'; box-shadow:0 10px 40px rgba(0,0,0,.22); }
    @media(max-width:960px){.routine-grid{grid-template-columns:repeat(2,1fr)}.source-grid{grid-template-columns:repeat(2,1fr)}.loop-orbit{opacity:.25;right:-70px}.loops-hero-inner{position:relative;z-index:2}}
    @media(max-width:640px){.loops-hero{padding:120px 16px 54px}.loop-orbit{display:none}.filter-row,.market-wrap{padding-left:16px;padding-right:16px}.routine-grid,.source-grid{grid-template-columns:1fr}.market-head{align-items:start;flex-direction:column}.submit-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.nav-links{display:none!important}.source-section{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>

<script type="text/babel">
const { useEffect, useMemo, useState } = React;
const { motion, AnimatePresence } = window.Motion;

const ROUTINES = [
  { id:'docs-parity', title:'Documentation parity', icon:'DOC', category:'Engineering', cadence:'On change', complexity:'Focused', author:'skillscale', stars:284, license:'MIT', featured:true, tools:['Git','Tests'], description:'Keep setup guides, API references, examples, and runbooks aligned with the code that actually ships.', prompt:'Review implementation changes since the last documentation update. Find only concrete documentation drift, correct it, verify every changed command and link, and prepare a reviewable diff.', steps:['Identify implementation changes','Map affected documentation','Correct verified drift','Test commands and links'], verify:'Every changed claim is supported by the current repository.', stop:'Stop when affected docs match shipped behavior and the documentation checks pass.' },
  { id:'release-proof', title:'Release readiness proof', icon:'REL', category:'Operations', cadence:'Per release', complexity:'Deep', author:'skillscale', stars:241, license:'MIT', featured:true, tools:['GitHub','CI'], description:'Turn a release candidate into an evidence-backed go/no-go decision with rollback notes.', prompt:'Audit the release candidate against its acceptance criteria, CI results, migrations, observability, and rollback path. Fix only in-scope blockers and publish the evidence.', steps:['Read release criteria','Inspect checks and migrations','Exercise critical paths','Record go/no-go evidence'], verify:'Acceptance criteria, checks, rollback, and owner are recorded.', stop:'Stop at a defensible go decision or a blocker with owner and next action.' },
  { id:'test-stabilizer', title:'Test stabilizer', icon:'TST', category:'Engineering', cadence:'On failure', complexity:'Focused', author:'skillscale', stars:219, license:'MIT', featured:true, tools:['Tests','CI'], description:'Reproduce flaky tests, isolate nondeterminism, and prove stability without hiding failures.', prompt:'Reproduce the unstable test under controlled repetition. Identify the actual nondeterministic dependency, fix the cause, and rerun enough times to demonstrate stability. Never add blind retries.', steps:['Reproduce repeatedly','Isolate shared state or timing','Fix the root cause','Run a stability sample'], verify:'The original failure cannot be reproduced across the agreed sample.', stop:'Stop after the stability target passes with no retry-based masking.' },
  { id:'accessibility-repair', title:'Accessibility repair', icon:'A11Y', category:'Design', cadence:'Weekly', complexity:'Deep', author:'skillscale', stars:198, license:'MIT', tools:['Browser','Axe'], description:'Find and repair high-impact keyboard, semantic, contrast, and screen-reader defects.', prompt:'Audit the selected user journey with keyboard, semantics, contrast, focus order, and an automated accessibility scanner. Repair failures without changing intended behavior.', steps:['Choose a critical journey','Run manual and automated checks','Repair prioritized defects','Repeat the same checks'], verify:'No critical or serious violations remain in the scoped journey.', stop:'Stop when the scoped journey passes automated checks and manual keyboard review.' },
  { id:'dependency-burndown', title:'Dependency risk burndown', icon:'CVE', category:'Security', cadence:'Weekly', complexity:'Deep', author:'skillscale', stars:187, license:'MIT', tools:['SCA','Tests'], description:'Reduce actionable dependency exposure while protecting compatibility and reproducibility.', prompt:'Inventory direct and transitive dependency findings. Confirm exploitability and available fixes, upgrade the smallest safe set, and validate behavior and lockfile integrity.', steps:['Inventory findings','Prioritize reachable risk','Apply minimal upgrades','Run regression checks'], verify:'Resolved findings are absent and remaining risk has an explicit disposition.', stop:'Stop when scoped critical risk is fixed or formally blocked with evidence.' },
  { id:'performance-budget', title:'Performance budget guardian', icon:'PERF', category:'Engineering', cadence:'Per PR', complexity:'Focused', author:'skillscale', stars:176, license:'MIT', tools:['Lighthouse','Profiler'], description:'Protect latency and bundle budgets with measured, user-visible evidence.', prompt:'Measure the target path using the agreed environment and baseline. Find the dominant regression, make the smallest effective change, and compare repeated before/after samples.', steps:['Capture baseline','Find dominant cost','Apply one bounded change','Compare repeated samples'], verify:'The agreed percentile and bundle budgets pass without functional regression.', stop:'Stop when all scoped budgets pass or measurement proves an external blocker.' },
  { id:'incident-learning', title:'Incident learning loop', icon:'OPS', category:'Operations', cadence:'After incident', complexity:'Deep', author:'skillscale', stars:164, license:'MIT', tools:['Logs','Runbook'], description:'Convert incident evidence into owned corrective actions and tested operational knowledge.', prompt:'Build a timestamped incident timeline from primary evidence. Separate contributing conditions from root causes, define corrective actions, and exercise the updated detection or recovery path.', steps:['Assemble evidence timeline','Identify causal chain','Assign corrective actions','Test detection and recovery'], verify:'Each action has an owner, deadline, and proof method.', stop:'Stop when the review is published and the highest-risk correction is verified or scheduled.' },
  { id:'feedback-synthesis', title:'Feedback signal synthesis', icon:'VOC', category:'Research', cadence:'Weekly', complexity:'Focused', author:'skillscale', stars:151, license:'MIT', tools:['Support','Analytics'], description:'Turn scattered customer language into ranked product signals without flattening minority pain.', prompt:'Collect feedback from the authorized sources and timeframe. De-duplicate, cluster by underlying job or friction, retain representative evidence, and rank findings by reach, severity, and confidence.', steps:['Collect scoped feedback','Remove duplicates','Cluster underlying needs','Rank with evidence'], verify:'Every finding links to source evidence and states confidence.', stop:'Stop when new samples no longer change the top-ranked themes materially.' },
  { id:'research-brief', title:'Research-to-brief', icon:'R&D', category:'Research', cadence:'On demand', complexity:'Deep', author:'skillscale', stars:143, license:'MIT', tools:['Web','Citations'], description:'Produce a decision-ready brief from current primary sources and explicit uncertainty.', prompt:'Frame the decision and evidence threshold. Gather current primary sources, reconcile disagreements, distinguish facts from inference, and produce a concise brief with citations and open questions.', steps:['Frame decision','Gather primary sources','Reconcile evidence','Write cited brief'], verify:'Material claims have direct citations and uncertainty is explicit.', stop:'Stop when additional sources are unlikely to change the decision recommendation.' },
  { id:'content-atomizer', title:'Content atomizer', icon:'CNT', category:'Content', cadence:'Per publish', complexity:'Focused', author:'skillscale', stars:132, license:'MIT', tools:['CMS','Social'], description:'Adapt one approved source into channel-native assets while preserving meaning and provenance.', prompt:'Extract the approved source thesis, evidence, and voice constraints. Create channel-native variants without adding unsupported claims, then cross-check each against the source.', steps:['Extract source spine','Map channel constraints','Draft native variants','Check claim fidelity'], verify:'Every factual claim traces to the approved source.', stop:'Stop when each requested channel has one review-ready variant and claim review passes.' },
  { id:'seo-freshness', title:'Search freshness sweep', icon:'SEO', category:'Content', cadence:'Monthly', complexity:'Deep', author:'skillscale', stars:121, license:'MIT', tools:['Search Console','CMS'], description:'Refresh decaying pages using query evidence, intent fit, and factual maintenance.', prompt:'Identify pages with verified traffic or ranking decay. Compare current query intent and competing coverage, update stale evidence and missing sections, and record the baseline for later review.', steps:['Find verified decay','Reassess intent','Refresh stale coverage','Record measurement window'], verify:'Content is current, internally coherent, and mapped to observed queries.', stop:'Stop when scoped pages are published and their measurement checkpoints are scheduled.' },
  { id:'meeting-actions', title:'Meeting-to-actions', icon:'MTG', category:'Operations', cadence:'Per meeting', complexity:'Quick', author:'skillscale', stars:113, license:'MIT', tools:['Calendar','Docs'], description:'Convert authorized meeting notes into decisions, owners, deadlines, and unresolved questions.', prompt:'Review the meeting record. Extract only explicit decisions and commitments, assign named owners and dates where stated, flag ambiguity, and produce a concise follow-up.', steps:['Extract decisions','Capture commitments','Resolve or flag owners','Publish follow-up'], verify:'Every action is attributable to the meeting record.', stop:'Stop when participants can confirm or correct the decision log asynchronously.' },
  { id:'inbox-triage', title:'Inbox action triage', icon:'MAIL', category:'Operations', cadence:'Daily', complexity:'Quick', author:'skillscale', stars:108, license:'MIT', tools:['Email','Calendar'], description:'Separate urgent decisions, replies, waiting items, and low-value noise without sending automatically.', prompt:'Review the authorized inbox window. Classify messages by urgency and required action, group related threads, draft concise replies where useful, and never send or archive without confirmation.', steps:['Scan scoped window','Group related threads','Rank action required','Draft next actions'], verify:'Each urgent item has a clear reason and next action.', stop:'Stop when every scoped thread is classified and no external action has been taken without approval.' },
  { id:'data-quality', title:'Data quality sentinel', icon:'DATA', category:'Research', cadence:'Daily', complexity:'Deep', author:'skillscale', stars:99, license:'MIT', tools:['SQL','Alerts'], description:'Detect schema, freshness, volume, and distribution drift before downstream decisions fail.', prompt:'Check the critical dataset contracts for freshness, schema, row volume, nulls, uniqueness, and distribution drift. Trace failures upstream and produce bounded remediation.', steps:['Load data contracts','Run invariant checks','Trace failed assumptions','Repair or quarantine'], verify:'Contracts pass and quarantined data cannot reach dependent outputs.', stop:'Stop when critical contracts pass or downstream consumers are safely blocked.' },
  { id:'design-critique', title:'Evidence-led design critique', icon:'UX', category:'Design', cadence:'Per milestone', complexity:'Focused', author:'skillscale', stars:94, license:'MIT', tools:['Browser','Analytics'], description:'Critique a user journey against intent, hierarchy, accessibility, and observed behavior.', prompt:'State the journey and user intent. Review information hierarchy, interaction cost, responsive behavior, accessibility, and available behavioral evidence. Rank issues by impact and confidence.', steps:['State user intent','Walk the journey','Collect evidence','Rank recommendations'], verify:'Recommendations name the affected user, evidence, expected outcome, and validation method.', stop:'Stop when the highest-impact issues have testable acceptance criteria.' },
  { id:'sales-followup', title:'Account follow-up routine', icon:'CRM', category:'Growth', cadence:'Weekly', complexity:'Quick', author:'skillscale', stars:86, license:'MIT', tools:['CRM','Email'], description:'Prepare relevant, permission-aware follow-ups from verified account context.', prompt:'Review authorized account history, recent commitments, and current signals. Draft a specific follow-up that advances the agreed next step without inventing urgency or personal context.', steps:['Review account history','Confirm last commitment','Draft relevant follow-up','Check permissions'], verify:'Every personalized detail is supported by authorized account data.', stop:'Stop with a review-ready draft; do not send without approval.' },
  { id:'competitor-watch', title:'Competitor change watch', icon:'MKT', category:'Growth', cadence:'Weekly', complexity:'Focused', author:'skillscale', stars:79, license:'MIT', tools:['Web','Diff'], description:'Track meaningful product, pricing, positioning, and hiring changes using primary sources.', prompt:'Check the approved competitor list and source set for changes since the last snapshot. Separate observed changes from interpretation, assess likely impact, and preserve source links.', steps:['Load prior snapshot','Check primary sources','Classify changes','Assess impact carefully'], verify:'Every observed change includes a dated primary source.', stop:'Stop after all approved competitors are checked and material changes are summarized.' },
  { id:'onboarding-friction', title:'Onboarding friction sweep', icon:'FTUE', category:'Design', cadence:'Per release', complexity:'Deep', author:'skillscale', stars:72, license:'MIT', tools:['Browser','Analytics'], description:'Find where a new user loses context, confidence, or momentum before reaching first value.', prompt:'Run the new-user journey from a clean state using the target device. Record confusing decisions, dead ends, latency, accessibility failures, and time to first value, then repair the highest-impact friction.', steps:['Start from clean state','Record friction evidence','Prioritize first-value blockers','Repair and replay'], verify:'A fresh run reaches first value within the agreed time and without assistance.', stop:'Stop when critical blockers are removed and the replay meets the onboarding target.' }
];

const SOURCES = [
  { mark:'LL', name:'Forward Future Loop Library', count:'64 agent loops', license:'MIT', kind:'Prompt loops', href:'https://signals.forwardfuture.ai/loop-library/', repo:'https://github.com/Forward-Future/loop-library', description:'Agent workflows organized across engineering, evaluation, operations, content, and design, each with verification and a stopping condition.' },
  { mark:'HG', name:'Huginn', count:'Community agents', license:'MIT', kind:'Event automation', href:'https://github.com/huginn/huginn', description:'A mature open-source system for agents that monitor sources, transform events, and act on your behalf.' },
  { mark:'NR', name:'Node-RED Flow Library', count:'Community flows', license:'Apache-2.0 core', kind:'Low-code flows', href:'https://flows.nodered.org/', repo:'https://github.com/node-red/node-red', description:'Reusable nodes and event-driven flows backed by the Apache-licensed Node-RED runtime.' },
  { mark:'N8', name:'n8n Workflow Gallery', count:'10k+ workflows', license:'Fair-code', kind:'Automation reference', href:'https://n8n.io/workflows/', description:'A large automation template gallery. Useful for discovery, but fair-code licensing is distinct from OSI open source.' }
];

function ThemeToggle({ theme, onToggle }) {
  return <button className="lg" onClick={onToggle} title={`Switch to ${theme==='light'?'dark':'light'} mode`} style={{width:38,height:38,borderRadius:'50%',border:'none',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,color:theme==='light'?'#111110':'#F1E9D8'}}>{theme==='light'?'☀️':'🌙'}</button>;
}

function Nav({ theme, onToggle }) {
  const isLight=theme==='light', navText=isLight?'#111110':'#D8CFC1';
  const pages=[['skills.html','Skills'],['market.html','Market'],['loops.html','Loops'],['community.html','Community'],['mcps.html','MCPs']];
  return <nav className="nav lg" style={{padding:'12px 24px',borderBottom:'1px solid var(--border)',borderRadius:0,background:isLight?'rgba(253,250,245,.94)':'rgba(12,11,9,.78)'}}><div className="nav-inner">
    <a href="index.html" style={{fontFamily:'Archivo Black',fontSize:'1.05rem',color:navText,flexShrink:0}}>skill<span style={{color:isLight?navText:'var(--accent)'}}>scale</span></a>
    <div className="nav-links" style={{display:'flex',alignItems:'center',gap:2}}>{pages.map(([href,label])=><a key={href} href={href} style={{fontFamily:'JetBrains Mono',fontSize:'.7rem',padding:'6px 12px',borderRadius:9999,color:href==='loops.html'?'var(--accent)':navText,background:href==='loops.html'?'rgba(212,102,26,.09)':'transparent'}}>{label}</a>)}</div>
    <div style={{display:'flex',alignItems:'center',gap:9}}><a href="#sources" style={{fontFamily:'JetBrains Mono',fontSize:'.68rem',color:navText,padding:'7px 12px',border:'1px solid var(--border)',borderRadius:9999}}>Sources</a><ThemeToggle theme={theme} onToggle={onToggle}/></div>
  </div></nav>;
}

function routineMarkdown(r) {
  return `# ${r.title}\n\n${r.description}\n\n## Prompt\n${r.prompt}\n\n## Steps\n${r.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n\n## Verification\n${r.verify}\n\n## Stop condition\n${r.stop}\n\nLicense: ${r.license}\n`;
}

function RoutineCard({ routine, saved, onSave, onOpen, onCopy }) {
  return <article className="routine-card" onClick={()=>onOpen(routine)}>
    <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'start'}}><div><span className="chip" style={{color:'var(--accent)',borderColor:'rgba(212,102,26,.28)'}}>{routine.category}</span><h3 style={{fontFamily:'Archivo Black',fontSize:'1.05rem',lineHeight:1.15,marginTop:12,color:'var(--text)'}}>{routine.title}</h3></div><span style={{fontFamily:'JetBrains Mono',fontSize:'.62rem',color:'var(--text-2)'}}>★ {routine.stars}</span></div>
    <div className="routine-flow"><span className="flow-node">IN</span><span className="flow-line"/><span className="flow-node">DO</span><span className="flow-line"/><span className="flow-node">✓</span></div>
    <p style={{fontFamily:'DM Sans',fontSize:'.84rem',lineHeight:1.55,color:'var(--text-2)'}}>{routine.description}</p>
    <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:14}}><span className="chip">↻ {routine.cadence}</span><span className="chip">◫ {routine.complexity}</span><span className="chip">{routine.license}</span></div>
    <div style={{fontFamily:'JetBrains Mono',fontSize:'.6rem',color:'var(--text-2)',marginTop:14}}>Stop: {routine.stop}</div>
    <div className="routine-actions"><button className={`routine-button ${saved?'saved':''}`} onClick={e=>{e.stopPropagation();onSave(routine.id)}}>{saved?'♥ Saved':'♡ Save'}</button><button className="routine-button" onClick={e=>{e.stopPropagation();onOpen(routine)}}>View</button><button className="routine-button primary" onClick={e=>{e.stopPropagation();onCopy(routine)}}>Copy</button></div>
  </article>;
}

function DetailModal({ routine, onClose, onCopy }) {
  if(!routine) return null;
  return <motion.div className="modal-backdrop" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} onMouseDown={e=>e.target===e.currentTarget&&onClose()}><motion.section className="loop-modal" role="dialog" aria-modal="true" aria-labelledby="routine-detail-title" initial={{opacity:0,y:20,scale:.98}} animate={{opacity:1,y:0,scale:1}} exit={{opacity:0,y:16,scale:.98}}>
    <header className="modal-head"><div><span className="chip" style={{color:'var(--accent)'}}>{routine.category} · {routine.license}</span><h2 id="routine-detail-title" style={{fontFamily:'Archivo Black',fontSize:'1.55rem',marginTop:10}}>{routine.title}</h2><p style={{fontFamily:'DM Sans',fontSize:'.85rem',color:'var(--text-2)',marginTop:7}}>by @{routine.author} · {routine.cadence}</p></div><button className="close-button" onClick={onClose} aria-label="Close routine details">×</button></header>
    <div className="modal-body"><p style={{fontFamily:'DM Sans',fontSize:'.95rem',color:'var(--text-2)',lineHeight:1.65}}>{routine.description}</p>
      <div className="detail-block"><span className="detail-label">Prompt</span><p style={{fontFamily:'JetBrains Mono',fontSize:'.76rem',lineHeight:1.65}}>{routine.prompt}</p></div>
      <div className="detail-block"><span className="detail-label">Run sequence</span><ol style={{paddingLeft:20,fontFamily:'DM Sans',fontSize:'.86rem',lineHeight:1.8}}>{routine.steps.map(s=><li key={s}>{s}</li>)}</ol></div>
      <div className="detail-block"><span className="detail-label">Verification</span><p style={{fontFamily:'DM Sans',fontSize:'.86rem'}}>{routine.verify}</p></div>
      <div className="detail-block" style={{borderColor:'rgba(212,102,26,.28)'}}><span className="detail-label">Stop condition</span><p style={{fontFamily:'DM Sans',fontSize:'.86rem'}}>{routine.stop}</p></div>
      <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:18}} onClick={()=>onCopy(routine)}>Copy as Markdown</button>
    </div>
  </motion.section></motion.div>;
}

function SubmitModal({ onClose, onSubmit }) {
  return <motion.div className="modal-backdrop" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} onMouseDown={e=>e.target===e.currentTarget&&onClose()}><motion.form className="loop-modal" role="dialog" aria-modal="true" aria-labelledby="submit-routine-title" initial={{opacity:0,y:20}} animate={{opacity:1,y:0}} onSubmit={onSubmit}>
    <header className="modal-head"><div><span className="detail-label">Local open-source draft</span><h2 id="submit-routine-title" style={{fontFamily:'Archivo Black',fontSize:'1.45rem'}}>Add a routine</h2></div><button className="close-button" type="button" onClick={onClose} aria-label="Close routine form">×</button></header>
    <div className="modal-body"><p style={{fontFamily:'DM Sans',fontSize:'.84rem',color:'var(--text-2)',marginBottom:18}}>Drafts stay in this browser. Copy the finished Markdown and submit it to the Skillscale repository when ready.</p><div className="submit-grid">
      <label className="field"><span>Routine name *</span><input name="title" required maxLength="80" placeholder="e.g. Weekly evidence sweep"/></label>
      <label className="field"><span>Category *</span><select name="category" defaultValue="Engineering">{['Engineering','Operations','Security','Research','Content','Design','Growth'].map(x=><option key={x}>{x}</option>)}</select></label>
      <label className="field full"><span>Outcome *</span><textarea name="description" required maxLength="240" placeholder="What repeatable outcome does this routine produce?"/></label>
      <label className="field full"><span>Prompt *</span><textarea name="prompt" required maxLength="1200" placeholder="Write the reusable instructions without secrets or private context."/></label>
      <label className="field"><span>Verification *</span><input name="verify" required placeholder="What proves it worked?"/></label>
      <label className="field"><span>Stop condition *</span><input name="stop" required placeholder="When must the loop stop?"/></label>
    </div><button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:18}} type="submit">Save local draft</button></div>
  </motion.form></motion.div>;
}

function App() {
  const [theme,setTheme]=useState(()=>localStorage.getItem('sk-theme')||'light');
  const [query,setQuery]=useState(''),[category,setCategory]=useState('All'),[cadence,setCadence]=useState('All'),[sort,setSort]=useState('Popular');
  const [selected,setSelected]=useState(null),[submitOpen,setSubmitOpen]=useState(false),[toast,setToast]=useState('');
  const [saved,setSaved]=useState(()=>{try{return JSON.parse(localStorage.getItem('skillscale-saved-routines')||'[]')}catch{return[]}});
  const [drafts,setDrafts]=useState(()=>{try{return JSON.parse(localStorage.getItem('skillscale-routine-drafts')||'[]')}catch{return[]}});
  useEffect(()=>{document.documentElement.dataset.theme=theme;localStorage.setItem('sk-theme',theme)},[theme]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),2200);return()=>clearTimeout(t)},[toast]);
  useEffect(()=>{const close=e=>{if(e.key==='Escape'){setSelected(null);setSubmitOpen(false)}};window.addEventListener('keydown',close);return()=>window.removeEventListener('keydown',close)},[]);
  const all=[...drafts,...ROUTINES];
  const categories=['All',...new Set(all.map(r=>r.category))];
  const cadences=['All',...new Set(all.map(r=>r.cadence))];
  const filtered=useMemo(()=>{const q=query.trim().toLowerCase();const rows=all.filter(r=>(category==='All'||r.category===category)&&(cadence==='All'||r.cadence===cadence)&&(!q||[r.title,r.description,r.category,...r.tools].join(' ').toLowerCase().includes(q)));return [...rows].sort((a,b)=>sort==='Newest'?(b.local?1:0)-(a.local?1:0):sort==='A–Z'?a.title.localeCompare(b.title):b.stars-a.stars)},[query,category,cadence,sort,drafts]);
  function notify(message){setToast(message)}
  function toggleSave(id){const next=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];setSaved(next);localStorage.setItem('skillscale-saved-routines',JSON.stringify(next));notify(next.includes(id)?'Routine saved':'Routine removed')}
  async function copyRoutine(r){const value=routineMarkdown(r);try{await navigator.clipboard.writeText(value)}catch{const area=document.createElement('textarea');area.value=value;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}notify('Routine copied as Markdown')}
  function addDraft(e){e.preventDefault();const f=new FormData(e.currentTarget);const draft={id:`local-${Date.now()}`,title:f.get('title'),category:f.get('category'),description:f.get('description'),prompt:f.get('prompt'),verify:f.get('verify'),stop:f.get('stop'),steps:['Confirm scope and inputs','Run the routine','Collect verification evidence','Apply the stop condition'],icon:'NEW',cadence:'On demand',complexity:'Focused',author:'local',stars:0,license:'MIT',tools:['Local'],local:true};const next=[draft,...drafts];setDrafts(next);localStorage.setItem('skillscale-routine-drafts',JSON.stringify(next));setSubmitOpen(false);setSelected(draft);notify('Local draft saved')}
  return <div className="loops-page"><Nav theme={theme} onToggle={()=>setTheme(t=>t==='light'?'dark':'light')}/>
    <header className="loops-hero"><div className="container loops-hero-inner" style={{margin:0,maxWidth:780}}><span style={{fontFamily:'JetBrains Mono',fontSize:'.68rem',letterSpacing:'.12em',color:'var(--accent)'}}>OPEN ROUTINE REGISTRY / v0.1</span><h1 className="t-display" style={{fontSize:'clamp(3.3rem,7vw,6.8rem)',lineHeight:.88,marginTop:18}}>Loops that know<br/><span style={{color:'var(--accent)'}}>when to stop.</span></h1><p style={{fontFamily:'DM Sans',fontSize:'1.02rem',lineHeight:1.65,color:'var(--text-2)',maxWidth:620,marginTop:24}}>Discover repeatable agent workflows with explicit inputs, proof, and stopping conditions. Copy, adapt, and share them under open licenses.</p><div style={{display:'flex',gap:10,flexWrap:'wrap',marginTop:28}}><button className="btn btn-primary" onClick={()=>document.getElementById('registry').scrollIntoView({behavior:'smooth'})}>Browse {all.length} routines ↓</button><button className="btn btn-outline" onClick={()=>setSubmitOpen(true)}>＋ Add a routine</button></div></div><div className="loop-orbit" aria-hidden="true"><span className="orbit-node">ASK</span><span className="orbit-node">DO</span><span className="orbit-node">CHK</span><span className="orbit-node">STOP</span></div></header>
    <div className="filter-shell" id="registry"><div className="filter-row"><input className="loop-search" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search outcomes, tools, or routines…" aria-label="Search routines"/><select className="filter-select" value={category} onChange={e=>setCategory(e.target.value)}>{categories.map(x=><option key={x}>{x}</option>)}</select><select className="filter-select" value={cadence} onChange={e=>setCadence(e.target.value)}>{cadences.map(x=><option key={x}>{x}</option>)}</select><select className="filter-select" value={sort} onChange={e=>setSort(e.target.value)}>{['Popular','Newest','A–Z'].map(x=><option key={x}>{x}</option>)}</select></div></div>
    <main className="market-wrap"><div className="market-head"><div><span style={{fontFamily:'JetBrains Mono',fontSize:'.65rem',color:'var(--accent)'}}>// COMMUNITY ROUTINES</span><h2 style={{fontFamily:'Archivo Black',fontSize:'clamp(1.8rem,4vw,2.8rem)',marginTop:6}}>Ready to fork</h2></div><p style={{fontFamily:'JetBrains Mono',fontSize:'.68rem',color:'var(--text-2)'}}>{filtered.length} results · {saved.length} saved</p></div><div className="routine-grid">{filtered.length?filtered.map(r=><RoutineCard key={r.id} routine={r} saved={saved.includes(r.id)} onSave={toggleSave} onOpen={setSelected} onCopy={copyRoutine}/>):<div className="empty-state">No routines match these filters.<br/><button className="btn btn-outline btn-sm" style={{marginTop:14}} onClick={()=>{setQuery('');setCategory('All');setCadence('All')}}>Clear filters</button></div>}</div></main>
    <section className="source-section" id="sources"><div className="container"><div style={{maxWidth:720}}><span style={{fontFamily:'JetBrains Mono',fontSize:'.65rem',color:'var(--accent)'}}>// SOURCE ECOSYSTEMS</span><h2 className="t-display" style={{fontSize:'clamp(2.5rem,5vw,4.5rem)',marginTop:10}}>Go beyond this registry.</h2><p style={{fontFamily:'DM Sans',color:'var(--text-2)',marginTop:14,lineHeight:1.65}}>Source catalogs are linked with their actual license model. External content remains with its publisher; inspect the license before adapting or redistributing a template.</p></div><div className="source-grid">{SOURCES.map(s=><a className="source-card" href={s.href} target="_blank" rel="noopener noreferrer" key={s.name}><span className="source-mark">{s.mark}</span><h3 style={{fontFamily:'Archivo Black',fontSize:'.95rem'}}>{s.name}</h3><p style={{fontFamily:'DM Sans',fontSize:'.78rem',lineHeight:1.5,color:'var(--text-2)',marginTop:9}}>{s.description}</p><div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:'auto',paddingTop:16}}><span className="chip">{s.count}</span><span className="chip">{s.license}</span></div></a>)}</div></div></section>
    <footer className="footer" style={{background:'var(--bg)',borderTop:'1px solid var(--border)'}}><div className="container footer-inner"><span style={{fontFamily:'Archivo Black',fontSize:'.9rem'}}>skill<span style={{color:'var(--accent)'}}>scale</span></span><div style={{display:'flex',gap:20,flexWrap:'wrap'}}>{[['index.html','Home'],['skills.html','Skills'],['market.html','Market'],['loops.html','Loops'],['community.html','Community'],['mcps.html','MCPs']].map(([h,l])=><a key={h} href={h} style={{fontFamily:'JetBrains Mono',fontSize:'.68rem',color:'var(--text-2)'}}>{l}</a>)}</div><span style={{fontFamily:'JetBrains Mono',fontSize:'.64rem',color:'var(--text-2)'}}>Open routines · © 2026</span></div></footer>
    <AnimatePresence>{selected&&<DetailModal routine={selected} onClose={()=>setSelected(null)} onCopy={copyRoutine}/>}</AnimatePresence><AnimatePresence>{submitOpen&&<SubmitModal onClose={()=>setSubmitOpen(false)} onSubmit={addDraft}/>}</AnimatePresence><AnimatePresence>{toast&&<motion.div className="toast-loop" initial={{opacity:0,y:12}} animate={{opacity:1,y:0}} exit={{opacity:0,y:12}}>{toast}</motion.div>}</AnimatePresence>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
