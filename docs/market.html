function gemTier(stars) {
  if (stars >= 200) return 'Legendary';
  if (stars >= 50)  return 'Epic';
  if (stars >= 10)  return 'Rare';
  return 'Standard';
}

/* ===== SecureScore gem tier (score-based, for sale cards) ===== */
function scoreTier(score) {
  if (score >= 90) return 'diamond';
  if (score >= 80) return 'emerald';
  if (score >= 65) return 'pearl';
  if (score >= 50) return 'quartz';
  return 'coal';
}

/* ===== Vault helpers ===== */
const VAULT_KEY = 'skillscale_vault';
function getVault() {
  try { return JSON.parse(localStorage.getItem(VAULT_KEY) || '{"dreamed":[],"owned":[]}'); }
  catch { return { dreamed:[], owned:[] }; }
}
function saveVault(v) { localStorage.setItem(VAULT_KEY, JSON.stringify(v)); }
function getVaultCount() { const v = getVault(); return v.dreamed.length + v.owned.length; }
function isDreamed(id) { return getVault().dreamed.some(s => s.id === id); }
function dreamSkill(skill, score) {
  const v = getVault();
  if (!v.dreamed.find(s => s.id === skill.id)) {
    v.dreamed.push({ id:skill.id, name:skill.name, author:skill.author, score, tier:scoreTier(score), price:skill.price, savedAt:new Date().toISOString(), note:'' });
    saveVault(v);
  }
  return getVaultCount();
}
function undreamSkill(id) {
  const v = getVault();
  v.dreamed = v.dreamed.filter(s => s.id !== id);
  saveVault(v);
  return getVaultCount();
}

}

function readJsonStore(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
  catch { return fallback; }
}
function writeJsonStore(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

function enrichMarket(market) {
  const bestBid = Math.max(...market.bids.map(([p]) => p));
  const bestAsk = Math.min(...market.asks.map(([p]) => p));
  const trend = market.priceHistory[market.priceHistory.length - 1] - market.priceHistory[0];
  return { ...market, bestBid, bestAsk, spread: Math.max(bestAsk - bestBid, 0), trend };
}

function mergeStoredMarkets(seed) {
  const stored = readJsonStore(MARKET_STATE_KEY, {});
  return seed.map(m => enrichMarket({ ...m, ...(stored[m.id] || {}) }));
}

function saveMarketSnapshot(markets) {
  const snapshot = {};
  markets.forEach(m => {
    snapshot[m.id] = {
      yesPrice: m.yesPrice,
      volume: m.volume,
      volume24h: m.volume24h,
      liquidity: m.liquidity,
      watchers: m.watchers,
      priceHistory: m.priceHistory,
      bids: m.bids,
      asks: m.asks,
    };
  });
  writeJsonStore(MARKET_STATE_KEY, snapshot);
}

function sortMarkets(markets, mode) {
  const copy = [...markets];
  const byEnding = m => new Date(m.endTime).getTime();
  const sorters = {
    Hot: (a,b) => (b.volume24h + b.watchers * 8 + Math.abs(b.trend) * 1000) - (a.volume24h + a.watchers * 8 + Math.abs(a.trend) * 1000),
    Liquidity: (a,b) => b.liquidity - a.liquidity,
    Volume: (a,b) => b.volume - a.volume,
    New: (a,b) => byEnding(b) - byEnding(a),
    Ending: (a,b) => byEnding(a) - byEnding(b),
    Competitive: (a,b) => a.spread - b.spread,
  };
  return copy.sort(sorters[mode] || sorters.Hot);
}

function useRealtimeMarket() {
  const [markets, setMarkets] = useState(() => mergeStoredMarkets(MARKET_SKILLS));

  useEffect(() => {
    const timer = setInterval(() => {
      setMarkets(prev => {
        const next = prev.map((m, i) => {
          const wave = Math.sin(Date.now() / 12000 + i) * 0.006;
          const drift = (m.volume24h / Math.max(m.liquidity, 1)) * 0.004;
          const price = Math.min(0.96, Math.max(0.04, +(m.yesPrice + wave + drift - 0.002).toFixed(3)));
          const bidBase = Math.max(0.01, +(price - m.spread / 2).toFixed(2));
          const askBase = Math.min(0.99, +(price + m.spread / 2).toFixed(2));
          const bids = [[bidBase, m.bids[0][1]], [Math.max(0.01, bidBase - 0.02), m.bids[1][1]], [Math.max(0.01, bidBase - 0.05), m.bids[2][1]]];
          const asks = [[askBase, m.asks[0][1]], [Math.min(0.99, askBase + 0.02), m.asks[1][1]], [Math.min(0.99, askBase + 0.05), m.asks[2][1]]];
          return enrichMarket({
            ...m,
            yesPrice: price,
            volume: Math.round(m.volume + Math.max(1, m.volume24h / 260)),
            volume24h: Math.max(1, Math.round(m.volume24h + wave * 120)),
            liquidity: Math.max(100, Math.round(m.liquidity + Math.abs(wave) * 900)),
            priceHistory: [...m.priceHistory.slice(-10), price],
            bids,
            asks,
          });
        });
        saveMarketSnapshot(next);
        return next;
      });
    }, 6500);
    return () => clearInterval(timer);
  }, []);

  return [markets, setMarkets];
}

function storeOrder(order) {
  const orders = readJsonStore(MARKET_ORDERS_KEY, []);
  const next = [{ id:`ord_${Date.now()}`, createdAt:new Date().toISOString(), ...order }, ...orders].slice(0, 50);
  writeJsonStore(MARKET_ORDERS_KEY, next);
  return next;
}

function storeAgentImport(record) {

}

/* ===== Sparkline SVG ===== */
function SparklineSvg({ data, width=200, height=36 }) {
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 0.01;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 6) - 3;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const isUp = data[data.length - 1] >= data[0];
  return (
    <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" style={{ width:'100%', height:36, display:'block' }}>
      <polyline points={pts} fill="none"
        stroke={isUp ? '#10B981' : '#EF4444'}
        strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

/* ===== Skill Creation Bar ===== */
function SkillCreationBar({ onToast }) {
  const [expanded, setExpanded] = useState(false);
  const [prompt, setPrompt] = useState('');
  const [messages, setMessages] = useState([]);
  const [skillMd, setSkillMd] = useState(TEMPLATE_SKILL_MD);
  const [price, setPrice] = useState(0);
  const [mintNft, setMintNft] = useState(false);
  const [accessSource, setAccessSource] = useState('Claude.ai');
  const [accessUrl, setAccessUrl] = useState('');
  const [accessScope, setAccessScope] = useState('Read selected conversations and artifacts only');
  const [agentMode, setAgentMode] = useState('Scout');
  const promptRef = useRef(null);
  const chatEndRef = useRef(null);

  useEffect(() => {
    if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior:'smooth' });
  }, [messages]);

  function handleFileImport(e, source) {
    const file = e.target.files?.[0];
    if (!file) return;
    JSZip.loadAsync(file).then(zip => {
      const conv = zip.file('conversations.json') || zip.file('chat_messages.json');
      if (!conv) { onToast('conversations.json not found in the ZIP'); return; }
      conv.async('string').then(text => {
        try {
          const data = JSON.parse(text);
          const msgs = (Array.isArray(data) ? data : [data])
            .flatMap(c => (c.chat_messages || c.messages || []))
            .map(m => (typeof m.content === 'string' ? m.content : m.text || ''))
            .filter(Boolean)
            .slice(0, 30);
          if (!msgs.length) { onToast('No messages found in export file'); return; }
          onToast(`Imported ${msgs.length} messages from ${source}`);
          setExpanded(true);
          const userMsg = { role:'user', content: `Here's my ${source} conversation export. Please generate a SKILL.md from these interactions.` };
          const asstMsg = { role:'assistant', content: generateSkillFromMessages(msgs) };
          setMessages(prev => [...prev, userMsg, asstMsg]);
          setSkillMd(asstMsg.content);
        } catch {
          onToast('Failed to parse export file');
        }
      });
    }).catch(() => onToast('Failed to read ZIP file'));
    e.target.value = '';
  }

  function generateSkillFromMessages(msgs) {
    const sample = msgs.slice(0,5).join('\n').slice(0,200);
    return `---\nname: my-skill\ndescription: A skill generated from your conversation export. Edit the description to match what this skill does.\nauthor: you\nversion: 0.1.0\ntags: [custom, generated]\n---\n\n## Overview\n\nThis skill was generated from your conversation history. Review and customize it before publishing.\n\n## When to use\n\nInvoke this skill when you need to reproduce the patterns from your conversations.\n\n## Instructions\n\n${sample.slice(0,120)}...\n\n## Notes\n\n- Review and edit before publishing\n- Test with your agent before listing for sale`;
  }

  function handleSend() {
    if (!prompt.trim()) return;
    const userMsg = { role:'user', content: prompt };
    const asstMsg = {
      role: 'assistant',
      content: `I'll help you create a skill based on that. Here's a starting SKILL.md:\n\n\`\`\`\n---\nname: ${prompt.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,32)}\ndescription: ${prompt.slice(0,120)}\nauthor: you\nversion: 0.1.0\ntags: [custom]\n---\n\n## Overview\n\n${prompt}\n\n## When to use\n\nInvoke this skill when you need to ${prompt.toLowerCase()}.\n\n## Instructions\n\n1. Start by analyzing the context\n2. Apply the relevant patterns\n3. Return a well-structured result\n\`\`\`\n\nEdit the preview on the right. When ready, set your price and publish.`
    };
    setMessages(prev => [...prev, userMsg, asstMsg]);
    const mdMatch = asstMsg.content.match(/```[\w]*\n([\s\S]+?)```/);
    if (mdMatch) setSkillMd(mdMatch[1]);
    setPrompt('');
  }

  function handleAgentAccess() {
    const sourceName = accessSource || 'Agent workspace';
    const sourceHint = accessUrl.trim() || 'manual-access-record';
    const record = {
      source: sourceName,
      sourceHint,
      scope: accessScope,
      mode: agentMode,
      status: 'validated_locally',
      permissions: ['read:selected_conversations', 'read:artifacts', 'write:none'],
    };
    storeAgentImport(record);
    setExpanded(true);
    const generated = generateSkillFromMessages([
      `${sourceName} agent access setup`,
      `Source: ${sourceHint}`,
      `Scope: ${accessScope}`,
      `Mode: ${agentMode}`,
      prompt || 'Create a reusable Skillscale skill from this authorized workspace context.',
    ]);
    setMessages(prev => [...prev,
      { role:'user', content:`Agent access granted for ${sourceName}. Scope: ${accessScope}.` },
      { role:'assistant', content: generated }
    ]);
    setSkillMd(generated);
    onToast(`Agent access staged from ${sourceName}. No secret stored in the browser.`);
  }

  return (
    <div style={{ marginBottom: 64 }}>
      <motion.div
        layout
        className="lg-s"
        style={{ maxWidth:860, margin:'0 auto', borderRadius: expanded ? 24 : 9999, overflow:'hidden' }}
        transition={{ type:'spring', damping:30, stiffness:300 }}
      >
        {/* Input row */}
        <div style={{ display:'flex', alignItems:'center', gap:16, padding:'16px 22px', borderBottom: expanded ? '1px solid var(--border)' : 'none' }}>
          <span style={{ fontSize:18, flexShrink:0 }}>✦</span>
          <input
            ref={promptRef}
            className="creation-prompt"
            placeholder="Describe a skill you want to create or sell…"
            value={prompt}
            onChange={e => setPrompt(e.target.value)}
            onFocus={() => setExpanded(true)}
            onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
          />
          <button
            onClick={() => { if (!expanded) setExpanded(true); else handleSend(); }}
            className="btn btn-primary btn-sm"
            style={{ fontFamily:'JetBrains Mono', fontSize:'.72rem', flexShrink:0 }}
          >
            Generate →
          </button>
        </div>

        {/* Expanded dashboard */}
        <AnimatePresence>
          {expanded && (
            <motion.div
              initial={{ height:0, opacity:0 }} animate={{ height:'auto', opacity:1 }} exit={{ height:0, opacity:0 }}
              transition={{ duration:0.32, ease:'easeInOut' }}
              style={{ overflow:'hidden' }}
            >
              {/* Two-column layout */}
              <div className="creation-expanded-grid" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', minHeight:340 }}>
                {/* Left: chat */}
                <div style={{ borderRight:'1px solid var(--border)', display:'flex', flexDirection:'column', maxHeight:400 }}>
                  <div style={{ flex:1, overflowY:'auto', padding:'16px 18px', display:'flex', flexDirection:'column', gap:10 }}>
                    {messages.length === 0 && (
                      <p style={{ fontFamily:'DM Sans', fontSize:'.82rem', color:'var(--text-2)', textAlign:'center', marginTop:40 }}>
                        Describe a skill or import a conversation export below
                      </p>
                    )}
                    {messages.map((m, i) => (
                      <div key={i} className={m.role === 'user' ? 'chat-msg-user' : 'chat-msg-assistant'}>
                        {m.content}
                      </div>
                    ))}
                    <div ref={chatEndRef} />
                  </div>
                </div>

                {/* Right: SKILL.md preview */}
                <div style={{ display:'flex', flexDirection:'column' }}>
                  <div style={{ padding:'10px 16px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                    <span style={{ fontFamily:'JetBrains Mono', fontSize:'.62rem', color:'var(--text-2)', textTransform:'uppercase', letterSpacing:'.07em' }}>SKILL.md preview</span>
                    <span style={{ fontFamily:'JetBrains Mono', fontSize:'.6rem', color:'var(--text-2)' }}>editable</span>
                  </div>
                  <textarea

                      style={{ width:'100%', marginTop:5, padding:'9px 10px', borderRadius:8, border:'1px solid var(--border)', background:'var(--bg)', color:'var(--text)', fontFamily:'JetBrains Mono', fontSize:'.72rem' }}>
                      <option>Scout</option>
                      <option>Audit</option>
                      <option>Convert</option>
                      <option>Price</option>
                    </select>
                  </label>
                  <button className="btn btn-primary btn-sm" style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', whiteSpace:'nowrap' }} onClick={handleAgentAccess}>Stage access</button>
                </div>
              </div>

              {/* Import row */}
              <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:12, padding:'16px 20px', borderBottom:'1px solid var(--border)' }}>
                <label style={{ cursor:'pointer' }}>
                  <input type="file" accept=".zip" style={{ display:'none' }} onChange={e => handleFileImport(e, 'Claude.ai')} />
                  <div className="lg" style={{ borderRadius:12, padding:'12px 14px', display:'flex', alignItems:'center', gap:10, cursor:'pointer' }}>
                    <span style={{ fontSize:20, color:'#4B5CC4' }}>●</span>
                    <div>
                      <div style={{ fontFamily:'JetBrains Mono', fontSize:'.7rem', fontWeight:600, color:'var(--text)' }}>Import from Claude.ai</div>
                      <div style={{ fontFamily:'DM Sans', fontSize:'.72rem', color:'var(--text-2)' }}>Upload .zip export</div>
                    </div>
                  </div>
                </label>

                <label style={{ cursor:'pointer' }}>
                  <input type="file" accept=".zip" style={{ display:'none' }} onChange={e => handleFileImport(e, 'ChatGPT')} />
                  <div className="lg" style={{ borderRadius:12, padding:'12px 14px', display:'flex', alignItems:'center', gap:10, cursor:'pointer' }}>
                    <span style={{ fontSize:20, color:'#00B0BA' }}>●</span>
                    <div>
                      <div style={{ fontFamily:'JetBrains Mono', fontSize:'.7rem', fontWeight:600, color:'var(--text)' }}>Import from ChatGPT</div>
                      <div style={{ fontFamily:'DM Sans', fontSize:'.72rem', color:'var(--text-2)' }}>Upload .zip export</div>
                    </div>
                  </div>
                </label>

                <div className="lg" style={{ borderRadius:12, padding:'12px 14px', display:'flex', alignItems:'center', gap:10, cursor:'pointer' }}
                  onClick={handleAgentAccess}>
                  <span style={{ fontSize:20, color:'#177CB0' }}>↔</span>
                  <div>
                    <div style={{ fontFamily:'JetBrains Mono', fontSize:'.7rem', fontWeight:600, color:'var(--text)' }}>Agent Access</div>
                    <div style={{ fontFamily:'DM Sans', fontSize:'.72rem', color:'var(--text-2)' }}>Scoped import record</div>
                  </div>
                </div>
              </div>

              {/* Safety row */}
              <div style={{ display:'flex', alignItems:'center', gap:10, padding:'12px 20px', borderBottom:'1px solid var(--border)', flexWrap:'wrap' }}>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:'.62rem', color:'var(--text-2)', textTransform:'uppercase', letterSpacing:'.07em', marginRight:4 }}>Safety</span>
                <span className="btn btn-outline btn-sm" style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', gap:6, cursor:'default' }}>
                  Static preview mode
                </span>
                <span className="btn btn-outline btn-sm" style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', gap:6, cursor:'default' }}>
                  No API keys requested
                </span>
                <span style={{ fontFamily:'DM Sans', fontSize:'.75rem', color:'var(--text-2)', marginLeft:4 }}>
                  GitHub Pages stores locally; Supabase schema enables realtime durable publishing.
                </span>
              </div>

              {/* Publish bar */}
              <div style={{ display:'flex', alignItems:'center', gap:20, padding:'16px 20px', flexWrap:'wrap' }}>
                <div style={{ flex:1, minWidth:180 }}>
                  <label style={{ fontFamily:'JetBrains Mono', fontSize:'.62rem', color:'var(--text-2)', display:'block', marginBottom:6 }}>
                    Price: {price === 0 ? 'Free' : `${price} gems`}
                  </label>
                  <input type="range" min={0} max={100} step={5} value={price} onChange={e => setPrice(+e.target.value)}
                    style={{ width:'100%', accentColor:'var(--accent)' }} />
                </div>
                <label style={{ display:'flex', alignItems:'center', gap:8, fontFamily:'JetBrains Mono', fontSize:'.68rem', color:'var(--text-2)', cursor:'pointer', flexShrink:0 }}>
                  <input type="checkbox" checked={mintNft} onChange={e => setMintNft(e.target.checked)} style={{ accentColor:'var(--accent)', width:14, height:14 }} />
                  Mint as Rarible NFT
                </label>
                <button className="btn btn-primary" style={{ fontFamily:'JetBrains Mono', fontSize:'.75rem', flexShrink:0 }}
                  onClick={() => onToast(mintNft ? 'Rarible mint + publish coming in Phase 3 (Polygon)' : 'Publishing to Skillscale marketplace…')}>
                  Publish Skill ✦
                </button>
                <button onClick={() => setExpanded(false)} style={{ background:'none', border:'none', cursor:'pointer', fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'var(--text-2)' }}>
                  collapse
                </button>
              </div>
            </motion.div>
          )}
        </AnimatePresence>
      </motion.div>

    </div>
  );
}

const TEMPLATE_SKILL_MD = `---
name: my-skill
description: Describe what this skill does and when to use it.
author: you
version: 0.1.0
tags: [custom]
---

## Overview

Explain what this skill does.

## When to use

Describe the situations where this skill should activate.

## Instructions

1. Step one
2. Step two
3. Step three
`;

/* ===== App ===== */
function App() {
  const [theme, setTheme] = useState(() => {
    const s = localStorage.getItem('sk-theme');
    if (s) return s;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });
  const [marketFilter, setMarketFilter] = useState('Hot');
  const [selectedMarketId, setSelectedMarketId] = useState('frontend-design');
  const [toast, setToast] = useState('');
  const [toastVisible, setToastVisible] = useState(false);
  const [markets, setMarkets] = useRealtimeMarket();
  const headerRef = useRef(null);
  const headerInView = useInView(headerRef, { once: true });

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('sk-theme', theme);
  }, [theme]);

  function showToast(msg) {
    setToast(msg);
    setToastVisible(true);
    setTimeout(() => setToastVisible(false), 3000);
  }

  function handleBuy(item, side) {
    setSelectedMarketId(item.id);
    storeOrder({ marketId:item.id, marketName:item.name, side:side === 'ASK' ? 'ask' : 'bid', limit: side === 'ASK' ? item.bestAsk : item.bestBid, quantity:10, source:'quick-action' });
    showToast(`${side === 'ASK' ? 'Ask' : 'Bid'} staged for /${item.name}. Connect Supabase to sync live orders.`);
  }

  function handleOrder(order) {
    const orders = storeOrder({ ...order, source:'order-book' });
    setMarkets(prev => prev.map(m => {
      if (m.id !== order.marketId) return m;
      const row = [order.limit, order.quantity];
      const nextRows = order.side === 'bid'
        ? { bids: [row, ...m.bids].sort((a,b) => b[0] - a[0]).slice(0, 3) }
        : { asks: [row, ...m.asks].sort((a,b) => a[0] - b[0]).slice(0, 3) };
      return enrichMarket({ ...m, ...nextRows, watchers:m.watchers + 1 });
    }));
    showToast(`Order staged for /${order.marketName}. ${orders.length} recent local orders saved.`);
  }

  const filteredMarkets = sortMarkets(markets, marketFilter);
  const selectedMarket = filteredMarkets.find(m => m.id === selectedMarketId) || filteredMarkets[0];
  const totals = filteredMarkets.reduce((acc, m) => ({
    volume: acc.volume + m.volume,
    liquidity: acc.liquidity + m.liquidity,
    volume24h: acc.volume24h + m.volume24h,
  }), { volume:0, liquidity:0, volume24h:0 });

  return (
    <>
      <Nav theme={theme} onToggle={() => setTheme(t => t==='light'?'dark':'light')} currentPage="market.html" />
      <Toast message={toast} visible={toastVisible} />

      <main style={{ background:'var(--bg)', minHeight:'100vh' }}>
        {/* Page header / banner */}
        <div className="page-top lg-s" style={{ borderBottom:'1px solid var(--border)', paddingBottom:0, overflow:'hidden', position:'relative' }} ref={headerRef}>
          {/* Animated accent strip */}
          <motion.div
            initial={{ scaleX:0, originX:0 }}
            animate={headerInView ? { scaleX:1 } : {}}
            transition={{ duration:1.1, ease:'easeOut', delay:0.2 }}
            style={{ position:'absolute', bottom:0, left:0, right:0, height:2, background:`linear-gradient(90deg, var(--accent), transparent 60%)` }}
          />
          <div className="container" style={{ paddingTop:40, paddingBottom:36 }}>
            <motion.div
              initial={{ opacity:0, y:20 }} animate={headerInView ? { opacity:1, y:0 } : {}}
              transition={{ duration:0.55, ease:'easeOut' }}
            >
              <span style={{ fontFamily:'JetBrains Mono', fontSize:'.7rem', letterSpacing:'.08em', color:'var(--accent)', textTransform:'uppercase', display:'block', marginBottom:10 }}>
                // Skill Marketplace
              </span>
              <h1 className="t-display" style={{ fontSize:'clamp(2.4rem,5vw,4.5rem)', color:'var(--text)', lineHeight:.92, marginBottom:16 }}>
                Create, trade &amp;<br/>collect skills
              </h1>
              <p style={{ fontFamily:'DM Sans', fontSize:'1rem', color:'var(--text-2)', maxWidth:540, lineHeight:1.6, marginBottom:32 }}>
                Build skills from your AI conversations, trade skill markets on-chain, and earn gems when others install your work.
              </p>
            </motion.div>

            {/* Stats row */}
            <motion.div
              initial={{ opacity:0, y:12 }} animate={headerInView ? { opacity:1, y:0 } : {}}
              transition={{ duration:0.5, ease:'easeOut', delay:0.25 }}
              style={{ display:'flex', gap:24, flexWrap:'wrap' }}
            >
              {[
                { label:'Active markets', value:markets.length.toLocaleString(), icon:'↗' },
                { label:'24h volume', value:`$${totals.volume24h.toLocaleString()}`, icon:'↔' },
                { label:'Liquidity', value:`$${totals.liquidity.toLocaleString()}`, icon:'◎' },
                { label:'Orders staged', value:readJsonStore(MARKET_ORDERS_KEY, []).length.toLocaleString(), icon:'≋' },
              ].map(stat => (
                <div key={stat.label} className="lg" style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 18px', borderRadius:12 }}>
                  <span style={{ fontSize:'1.1rem' }}>{stat.icon}</span>
                  <div>
                    <span style={{ fontFamily:'Archivo Black', fontSize:'1.1rem', color:'var(--text)', display:'block', lineHeight:1.1 }}>{stat.value}</span>
                    <span style={{ fontFamily:'JetBrains Mono', fontSize:'.58rem', color:'var(--text-2)', textTransform:'uppercase', letterSpacing:'.07em' }}>{stat.label}</span>
                  </div>
                </div>
              ))}
            </motion.div>
          </div>
        </div>

        <div className="section-sm">
          <div className="container">

            {/* Section A: Skill Creation Bar */}
            <div style={{ marginBottom:72 }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:28, flexWrap:'wrap', gap:12 }}>
                <h2 style={{ fontFamily:'Archivo Black', fontSize:'1.3rem', color:'var(--text)' }}>Create a skill</h2>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', color:'var(--text-2)' }}>
                  Import from Claude.ai · ChatGPT · agent access · or describe from scratch
                </span>
              </div>
              <SkillCreationBar onToast={showToast} />
            </div>

            {/* Section B: Live Market */}
            <div style={{ marginBottom:72 }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20, flexWrap:'wrap', gap:12 }}>
                <div>
                  <h2 style={{ fontFamily:'Archivo Black', fontSize:'1.3rem', color:'var(--text)', marginBottom:4 }}>Skill Markets</h2>
                  <p style={{ fontFamily:'DM Sans', fontSize:'.82rem', color:'var(--text-2)' }}>
                    Dynamic skill pricing with bid/ask depth, liquidity signals, local staged orders, and a Supabase realtime upgrade path.
                  </p>
                </div>
                <button
                  onClick={() => showToast('WalletConnect can sit after Supabase order settlement; local order flow is ready now.')}
                  className="btn lg btn-sm"
                  style={{ fontFamily:'JetBrains Mono', fontSize:'.72rem', color:'var(--text)', gap:8 }}
                >
                  <span style={{ width:8, height:8, borderRadius:'50%', background:'#00B0BA', display:'inline-block', boxShadow:'0 0 6px rgba(0,176,186,0.45)' }} />
                  Connect Wallet
                </button>
              </div>

              {/* Filter row */}
              <div style={{ display:'flex', gap:7, flexWrap:'wrap', marginBottom:24 }}>
                {['Hot','Liquidity','Volume','New','Ending','Competitive'].map(f => (
                  <button key={f} className="tag"
                    onClick={() => setMarketFilter(f)}
                    style={{
                      borderColor: marketFilter===f ? 'var(--accent)' : 'var(--border)',
                      color: marketFilter===f ? 'var(--accent)' : 'var(--text-2)',
                      background: marketFilter===f ? 'transparent' : 'transparent',
                    }}>
                    {f}
                  </button>
                ))}
              </div>

              <div style={{ display:'grid', gridTemplateColumns:'minmax(0,1fr) 320px', gap:18, alignItems:'start' }} className="market-shell">
                <div className="grid-3" style={{ gap:16 }}>
                  {filteredMarkets.map((m, i) => (
                    <TradingCard key={m.id} market={m} index={i} selected={selectedMarket?.id === m.id} onSelect={setSelectedMarketId} onBuy={handleBuy} />
                  ))}
                </div>
                <OrderBookPanel market={selectedMarket} onOrder={handleOrder} />
              </div>
              {filteredMarkets.length === 0 && (
                <p style={{ fontFamily:'JetBrains Mono', fontSize:'.8rem', color:'var(--text-2)', textAlign:'center', padding:'40px 0' }}>No markets match this filter.</p>
              )}
            </div>

            {/* Section C: Top Skills for Sale */}
            <div>
              <div style={{ marginBottom:24 }}>
                <h2 style={{ fontFamily:'Archivo Black', fontSize:'1.3rem', color:'var(--text)', marginBottom:4 }}>Top Skills for Sale</h2>
                <p style={{ fontFamily:'DM Sans', fontSize:'.82rem', color:'var(--text-2)' }}>
                  Gem-priced, AI-audited. One-time purchase, yours forever.
                </p>
              </div>
              <div className="grid-3" style={{ gap:16 }}>
                {SALE_SKILLS.map((s, i) => (
                  <SaleCard key={s.id} skill={s} index={i} onBuy={handleBuy} />
                ))}
              </div>
            </div>

          </div>
        </div>

        <Footer />
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
