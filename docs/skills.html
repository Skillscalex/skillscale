<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const { motion, useInView, AnimatePresence } = window.Motion;

function getApiBaseCandidates() {
  const bases = [];
  const origin = window.location.origin;
  if (origin && origin !== 'null' && !origin.includes('github.io')) bases.push(origin);
  if (origin.includes('-3000.app.github.dev')) bases.push(origin);
  bases.push('http://localhost:3000');
  bases.push('http://127.0.0.1:3000');
  return [...new Set(bases)];
}

async function fetchSkillsSearch(params) {
  const path = `/api/v1/skills/search?${params.toString()}`;
  let lastError = null;
  for (const base of getApiBaseCandidates()) {
    try {
      const resp = await fetch(`${base}${path}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      return await resp.json();
    } catch (error) {
      lastError = error;
    }
  }
  throw lastError || new Error('Skills API unavailable');
}

const PAGES_CATALOG_URL = 'data/skills-catalog.json';
const OCCUPATION_COUNTS_URL = 'data/occupation-counts.json';
const SKILLS_INDEX_URL = 'data/skills-index';
const CATALOG_POLL_MS = 15000;

async function fetchPagesCatalog() {
  const resp = await fetch(`${PAGES_CATALOG_URL}?t=${Date.now()}`, { cache:'no-store' });
  if (!resp.ok) throw new Error(`Catalog HTTP ${resp.status}`);
  return await resp.json();
}

function normalizeCatalogSkill(skill) {
  const name = String(skill?.name || skill?.id || 'unnamed-skill').trim();
  const id = String(skill?.id || name).trim();
  const tags = Array.isArray(skill?.tags) ? skill.tags.map(String).filter(Boolean).slice(0, 8) : [];
  const updatedAt = String(skill?.updatedAt || Math.floor(Date.now() / 1000));
  return {
    id,
    name,
    author: String(skill?.author || 'skillscale'),
    stars: Number.isFinite(Number(skill?.stars)) ? Number(skill.stars) : 0,
    description: String(skill?.description || 'Governed skill catalog entry.'),
    tags,
    updatedAt,
    occupationId: String(skill?.occupationId || '01'),
    githubUrl: skill?.githubUrl ? String(skill.githubUrl) : undefined,
    source: skill?.source ? String(skill.source) : 'skillscale',
    secureScore: Number.isFinite(Number(skill?.secureScore)) ? Number(skill.secureScore) : 91,
    auditStatus: skill?.auditStatus || 'approved',
  };
}

function mergeSkills(...groups) {
  const byKey = new Map();
  const byName = new Map();
  groups.flat().forEach(rawSkill => {
    const skill = normalizeCatalogSkill(rawSkill);
    if (!skill.id || !skill.name) return;
    const nameKey = skill.name.toLowerCase();
    const key = byName.get(nameKey) || skill.id;
    const existing = byKey.get(key);
    if (!existing || skill.secureScore > existing.secureScore || skill.stars > existing.stars) byKey.set(key, skill);
    byName.set(nameKey, key);
  });
  return [...byKey.values()].sort((a, b) => b.stars - a.stars || a.name.localeCompare(b.name));
}

function filterCatalogSkills(skills, occupationId, searchQ) {
  const q = searchQ.trim().toLowerCase();
  if (!q) return skills.filter(skill => skill.occupationId === occupationId);
  return skills.filter(skill => {
    const text = [skill.name, skill.description, skill.author, skill.source, ...(skill.tags || [])].join(' ').toLowerCase();
    return text.includes(q);
  });
}

function usePagesSkillCatalog() {
  const [state, setState] = useState({ status:'loading', skills:[], meta:null, lastLoadedAt:null, error:null });

  useEffect(() => {
    let alive = true;
    let timer = null;

    async function loadCatalog() {
      try {
        const catalog = await fetchPagesCatalog();
        const skills = Array.isArray(catalog?.skills) ? catalog.skills.map(normalizeCatalogSkill) : [];
        if (!alive) return;
        setState({ status:'ready', skills, meta:catalog, lastLoadedAt:new Date(), error:null });
      } catch (error) {
        if (!alive) return;
        setState(prev => ({
          ...prev,
          status: prev.skills.length ? 'stale' : 'error',
          error: error?.message || 'Catalog unavailable',
        }));
      }
    }

    loadCatalog();
    timer = window.setInterval(loadCatalog, CATALOG_POLL_MS);
    return () => {
      alive = false;
      if (timer) window.clearInterval(timer);
    };
  }, []);

  return state;
}

function useOccupationCounts() {
  const [state, setState] = useState({ status:'loading', occupations:OCCUPATIONS, meta:null, lastLoadedAt:null, error:null });

  useEffect(() => {
    let alive = true;

    async function loadCounts() {
      try {
        const resp = await fetch(`${OCCUPATION_COUNTS_URL}?t=${Date.now()}`, { cache:'no-store' });
        if (!resp.ok) throw new Error(`Occupation counts HTTP ${resp.status}`);
        const catalog = await resp.json();
        const incoming = Array.isArray(catalog?.occupations) ? catalog.occupations : [];
        const byId = new Map(incoming.map(occ => [String(occ.id), occ]));
        const occupations = OCCUPATIONS.map(occ => {
          const fresh = byId.get(occ.id);
          return fresh ? {
            ...occ,
            label: String(fresh.label || occ.label),
            count: String(fresh.displayCount || formatCompactCount(fresh.count) || occ.count),
            rawCount: Number(fresh.count || occ.rawCount || 0),
            sourceUrl: fresh.sourceUrl ? String(fresh.sourceUrl) : occ.sourceUrl,
            localCount: Number(fresh.localCount || 0),
            coveragePercent: Number(fresh.coveragePercent || 0),
            mirrorStatus: fresh.mirrorStatus ? String(fresh.mirrorStatus) : 'sampled',
          } : occ;
        });
        if (!alive) return;
        setState({ status:'ready', occupations, meta:catalog, lastLoadedAt:new Date(), error:null });
      } catch (error) {
        if (!alive) return;
        setState(prev => ({ ...prev, status:'error', error:error?.message || 'Occupation counts unavailable' }));
      }
    }

    loadCounts();
    return () => { alive = false; };
  }, []);

  return state;
}

function useOccupationShard(occupationId, page, pageSize) {
  const [state, setState] = useState({ status:'idle', skills:[], manifest:null, rootManifest:null, shardIndex:0, shardSize:500, error:null });

  useEffect(() => {
    let alive = true;

    async function loadShard() {
      setState(prev => ({ ...prev, status:'loading', error:null }));
      try {
        const rootResp = await fetch(`${SKILLS_INDEX_URL}/manifest.json?t=${Date.now()}`, { cache:'no-store' });
        const rootManifest = rootResp.ok ? await rootResp.json() : null;
        const manifestResp = await fetch(`${SKILLS_INDEX_URL}/${occupationId}/manifest.json?t=${Date.now()}`, { cache:'no-store' });
        if (!manifestResp.ok) throw new Error(`Shard manifest HTTP ${manifestResp.status}`);
        const manifest = await manifestResp.json();
        const shards = Array.isArray(manifest?.shards) ? manifest.shards : [];
        const shardSize = Number(manifest?.shardSize || 500);
        const shardIndex = Math.floor(((Math.max(1, page) - 1) * pageSize) / shardSize);
        const shardPath = shards[shardIndex] || null;
        if (!shardPath) {
          if (alive) setState({ status:'ready', skills:[], manifest, rootManifest, shardIndex, shardSize, error:null });
          return;
        }
        const shardResp = await fetch(`${SKILLS_INDEX_URL}/${shardPath}?t=${Date.now()}`, { cache:'no-store' });
        if (!shardResp.ok) throw new Error(`Skill shard HTTP ${shardResp.status}`);
        const shard = await shardResp.json();
        const skills = Array.isArray(shard?.skills) ? shard.skills.map(normalizeCatalogSkill) : [];
        if (alive) setState({ status:'ready', skills, manifest, rootManifest, shardIndex, shardSize, error:null });
      } catch (error) {
        if (alive) setState({ status:'error', skills:[], manifest:null, rootManifest:null, shardIndex:0, shardSize:500, error:error?.message || 'Skill shard unavailable' });
      }
    }

    loadShard();
    return () => { alive = false; };
  }, [occupationId, page, pageSize]);

  return state;
}

function formatCompactCount(value) {
  const count = Number(value);
  if (!Number.isFinite(count)) return '';
  if (count >= 1000000) return `${(count / 1000000).toFixed(count >= 10000000 ? 0 : 1)}M`;
  if (count >= 10000) return `${Math.round(count / 1000)}k`;
  if (count >= 1000) return `${(count / 1000).toFixed(1)}k`;
  return count.toLocaleString();
}

function formatCatalogTime(value) {
  if (!value) return 'pending';
  return value.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

function auditLabel(status) {
  if (status === 'blocked') return 'Blocked';
  if (status === 'needs_review') return 'Review';
  return 'Approved';
}

function auditColor(status) {
  if (status === 'blocked') return '#B42318';
  if (status === 'needs_review') return '#B45309';
  return '#1A7A4A';
}

/* ===== Vault helpers ===== */
const VAULT_KEY = 'skillscale_vault';
function getVault() {
  try { return JSON.parse(localStorage.getItem(VAULT_KEY) || '{"dreamed":[],"owned":[]}'); }
  catch { return { dreamed:[], owned:[] }; }
}
function saveVault(v) { localStorage.setItem(VAULT_KEY, JSON.stringify(v)); }
function getVaultCount() { const v = getVault(); return v.dreamed.length + v.owned.length; }
function isDreamed(id) { return getVault().dreamed.some(s => s.id === id); }
function dreamSkill(skill, score) {
  const v = getVault();
  if (!v.dreamed.find(s => s.id === skill.id)) {
    v.dreamed.push({ id:skill.id, name:skill.name, author:skill.author, score, tier:scoreTier(score), savedAt:new Date().toISOString(), note:'' });
    saveVault(v);
  }
  window.dispatchEvent(new Event('vault-updated'));
}
function undreamSkill(id) {
  const v = getVault();
  v.dreamed = v.dreamed.filter(s => s.id !== id);
  saveVault(v);
  window.dispatchEvent(new Event('vault-updated'));
}

/* ===== SecureScore gem tier (score-based) ===== */
function scoreTier(score) {
  if (score >= 90) return 'diamond';
  if (score >= 80) return 'emerald';
  if (score >= 65) return 'pearl';
  if (score >= 50) return 'quartz';
  return 'coal';
}
function getSkillSecureScore(skill) {
  if (Number.isFinite(Number(skill?.secureScore))) return Math.min(99, Math.max(1, Math.round(Number(skill.secureScore))));
  return Math.min(99, Math.max(60, ((skill.name.charCodeAt(0) * 3 + skill.name.length * 7 + (skill.name.charCodeAt(skill.name.length-1) || 5) * 2) % 35) + 65));
}
const SCORE_TIER_CONFIG = {
  diamond: { label:'Legendary', color:'#C09A2A', icon:'🌟' },
  emerald: { label:'Epic',      color:'#7B2FBE', icon:'⚡' },
  pearl:   { label:'Rare',      color:'#1565C0', icon:'💎' },
  quartz:  { label:'Standard',  color:'#2D6A4F', icon:'🌿' },
  coal:    { label:'Draft',     color:'#6A6460', icon:'⬜' },
};

/* ===== SecureScore bar (full horizontal) ===== */
function SecureScoreBar({ score }) {
  const tier = scoreTier(score);
  const cfg = SCORE_TIER_CONFIG[tier];
  const thumbLeft = Math.min(Math.max(score, 2), 98);
  const desc = score >= 90 ? 'Excellent — passes all security checks' :
               score >= 80 ? 'Good — minor gaps only' :
               score >= 65 ? 'Acceptable — review suggestions below' :
               score >= 50 ? 'Marginal — improvements recommended' : 'Poor — fails audit checks';
  return (
    <div style={{ marginBottom:20 }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', textTransform:'uppercase', letterSpacing:'.07em', color:'var(--text-2)' }}>SecureScore</span>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:'.78rem', fontWeight:700, color: cfg.color }}>{score}</span>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:'.62rem', padding:'2px 8px', borderRadius:9999, background: cfg.color + '18', color: cfg.color, border:`1px solid ${cfg.color}30` }}>{cfg.icon} {cfg.label}</span>
        </div>
      </div>
      <div className="secure-score-track" style={{ marginBottom:6 }}>
        <div className="secure-score-fill" style={{ width:`${score}%` }} />
        <div className="secure-score-thumb" style={{ left:`${thumbLeft}%`, background: cfg.color }} />
      </div>
      <p style={{ fontFamily:'DM Sans', fontSize:'.75rem', color:'var(--text-2)', margin:0 }}>{desc}</p>
    </div>
  );
}

    { id:'r2', user:'build_ops', rating:4, date:'2026-03-28', text:'Works great for most cases. Wish there were more examples in SKILL.md.' },

/* ===== Reviews Section ===== */
function ReviewsSection({ skill }) {
  const reviews = MOCK_REVIEWS_DB.default;
  const avgRating = (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1);
  const [myRating, setMyRating] = React.useState(0);
  const [hoverRating, setHoverRating] = React.useState(0);
  const [reviewText, setReviewText] = React.useState('');
  const [submitted, setSubmitted] = React.useState(false);

  function submit(e) {
    e.preventDefault();
    if (myRating === 0 || !reviewText.trim()) return;
    setSubmitted(true);
    setTimeout(() => { setSubmitted(false); setMyRating(0); setReviewText(''); }, 3000);
  }

  return (
    <div>
      <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:16 }}>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', textTransform:'uppercase', letterSpacing:'.07em', color:'var(--text-2)' }}>Reviews</span>
        <div style={{ flex:1, height:1, background:'var(--border)' }} />
      </div>
      {/* Summary */}
      <div style={{ display:'flex', alignItems:'center', gap:16, marginBottom:20 }}>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontFamily:'Archivo Black', fontSize:'2.4rem', color:'var(--text)', lineHeight:1 }}>{avgRating}</div>
          <div style={{ display:'flex', gap:3, justifyContent:'center', margin:'4px 0' }}>
            {[1,2,3,4,5].map(i => <span key={i} style={{ fontSize:14, color: i <= Math.round(avgRating) ? '#F59E0B' : 'var(--border)' }}>★</span>)}
          </div>
          <div style={{ fontFamily:'JetBrains Mono', fontSize:'.6rem', color:'var(--text-2)' }}>{reviews.length} reviews</div>
        </div>
        <div style={{ flex:1 }}>
          {[5,4,3,2,1].map(n => {
            const cnt = reviews.filter(r => r.rating === n).length;
            return (
              <div key={n} style={{ display:'flex', alignItems:'center', gap:8, marginBottom:3 }}>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:'.6rem', color:'var(--text-2)', width:8 }}>{n}</span>
                <div style={{ flex:1, height:5, borderRadius:9999, background:'var(--border)', overflow:'hidden' }}>
                  <div style={{ height:'100%', borderRadius:9999, background:'#F59E0B', width:`${(cnt/reviews.length)*100}%` }} />
                </div>
              </div>
            );
          })}
        </div>
      </div>
      {/* Review list */}
      <div style={{ display:'flex', flexDirection:'column', gap:12, marginBottom:20 }}>
        {reviews.map(r => (
          <div key={r.id} className="lg" style={{ padding:'12px 16px', borderRadius:12 }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
              <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'var(--accent)', fontWeight:600 }}>@{r.user}</span>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                <span style={{ display:'flex', gap:2 }}>{[1,2,3,4,5].map(i => <span key={i} style={{ fontSize:11, color: i<=r.rating?'#F59E0B':'var(--border)' }}>★</span>)}</span>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:'.58rem', color:'var(--text-2)' }}>{r.date}</span>
              </div>
            </div>
            <p style={{ fontFamily:'DM Sans', fontSize:'.82rem', color:'var(--text-2)', margin:0, lineHeight:1.5 }}>{r.text}</p>
          </div>
        ))}
      </div>
      {/* Write review */}
      {submitted ? (
        <div className="lg" style={{ padding:'14px 18px', borderRadius:12, textAlign:'center' }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:'.75rem', color:'#1A7A4A' }}>✓ Review submitted — thank you!</span>
        </div>
      ) : (
        <form onSubmit={submit} className="lg" style={{ padding:'16px 18px', borderRadius:14, display:'flex', flexDirection:'column', gap:10 }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'var(--text-2)', textTransform:'uppercase', letterSpacing:'.06em' }}>Write a Review</span>
          <div style={{ display:'flex', gap:6 }}>
            {[1,2,3,4,5].map(i => (
              <button type="button" key={i}
                onMouseEnter={() => setHoverRating(i)} onMouseLeave={() => setHoverRating(0)}
                onClick={() => setMyRating(i)}
                style={{ fontSize:22, background:'none', border:'none', cursor:'pointer', color: i<=(hoverRating||myRating)?'#F59E0B':'var(--border)', transition:'color 0.12s', lineHeight:1 }}>
                ★
              </button>
            ))}
          </div>
          <textarea
            value={reviewText} onChange={e => setReviewText(e.target.value)}
            placeholder="Share your experience with this skill…"
            rows={3}
            style={{ fontFamily:'DM Sans', fontSize:'.82rem', color:'var(--text)', background:'var(--bg)', border:'1px solid var(--border)', borderRadius:10, padding:'10px 14px', resize:'vertical', outline:'none', lineHeight:1.5 }}
          />
          <button type="submit" className="btn btn-primary btn-sm" style={{ fontFamily:'JetBrains Mono', fontSize:'.7rem', alignSelf:'flex-end' }}
            disabled={myRating === 0 || !reviewText.trim()}>
            Submit Review
          </button>
        </form>
      )}
    </div>
  );
}

/* ===== Trending Row ===== */
function TrendingRow({ onSelect, catalogSkills }) {
  const [trending, setTrending] = useState([]);
  const catalogTrending = useMemo(() => (
    mergeSkills(catalogSkills, STATIC_SKILLS)
      .filter(skill => skill.auditStatus !== 'blocked')
      .slice(0, 6)
  ), [catalogSkills]);

  useEffect(() => {
    if (catalogTrending.length) return;
    const params = new URLSearchParams({ q:'software development', limit:'6', page:'1' });
    fetchSkillsSearch(params)
      .then(d => { if (d.success && d.data?.skills) setTrending(d.data.skills.slice(0,6)); })
      .catch(() => {});
  }, [catalogTrending.length]);

  const displaySkills = catalogTrending.length ? catalogTrending : trending;
  if (!displaySkills.length) return null;
  return (
    <div style={{ marginBottom:32 }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', textTransform:'uppercase', letterSpacing:'.1em', color:'var(--accent)' }}>Trending</span>
        <div style={{ flex:1, height:1, background:'var(--border)' }} />

      <div style={{ display:'flex', gap:10, overflowX:'auto', paddingBottom:6 }}>
        {displaySkills.map(s => (
          <button
            key={s.id}
            onClick={() => onSelect(s)}
            className="lg"
            style={{ flexShrink:0, display:'flex', alignItems:'center', gap:8, padding:'8px 14px', borderRadius:12, border:'1px solid var(--border)', cursor:'pointer', whiteSpace:'nowrap' }}

/* ===== Helpers ===== */
function starsFromCount(n) {
  if (n >= 100) return 5;
  if (n >= 25)  return 4;
  if (n >= 10)  return 3;
  if (n >= 5)   return 2;
  return 1;
}

function timeAgoStr(updatedAt) {
  const d = Math.floor((Date.now() - new Date(parseInt(updatedAt) * 1000).getTime()) / 86400000);
  if (d < 1) return 'today';
  if (d === 1) return '1d ago';
  if (d < 7) return `${d}d ago`;
  if (d < 30) return `${Math.floor(d/7)}w ago`;
  return `${Math.floor(d/30)}mo ago`;
}

function renderMarkdown(md) {
  if (!md) return '';
  let html = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```[\w]*\n?([\s\S]*?)```/g, (_,c) => `<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm,  '<h2>$1</h2>')
    .replace(/^# (.+)$/gm,   '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^---+$/gm, '<hr/>')
    .replace(/^[-*] (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]+?<\/li>)/g, '<ul>$1</ul>')
    .replace(/<\/ul>\s*<ul>/g, '')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br/>');
  return `<p>${html}</p>`;
}

function SkillDetailPanel({ skill, onClose }) {
  const [mdContent, setMdContent] = useState('');
  const [mdLoading, setMdLoading] = useState(false);
  const [copied, setCopied] = useState(false);
  const [dreamed, setDreamed] = React.useState(false);

  React.useEffect(() => {
    if (skill) setDreamed(isDreamed(skill.id));
  }, [skill?.id]);

  function toggleDream() {
    if (!skill) return;
    const score = Math.min(99, Math.max(60, ((skill.name.charCodeAt(0) * 3 + skill.name.length * 7) % 35) + 65));
    if (dreamed) { undreamSkill(skill.id); setDreamed(false); }
    else { dreamSkill(skill, score); setDreamed(true); }
  }

  useEffect(() => {
    if (!skill?.githubUrl) return;
    setMdContent('');
    setMdLoading(true);
    const match = skill.githubUrl.match(/github\.com\/([^/]+)\/([^/]+)/);
    if (!match) { setMdLoading(false); return; }
    const [, owner, repo] = match;
    const tryFetch = branch =>
      fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/SKILL.md`)
        .then(r => { if (!r.ok) throw new Error(); return r.text(); });
    tryFetch('main')
      .catch(() => tryFetch('master'))
      .then(text => setMdContent(text))
      .catch(() => setMdContent(''))
      .finally(() => setMdLoading(false));
  }, [skill?.id]);

  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [onClose]);

  if (!skill) return null;
  const rating = starsFromCount(skill.stars || 0);
  const dicebearIcon = `https://api.dicebear.com/7.x/shapes/svg?seed=${encodeURIComponent(skill.name)}`;
  const dicebearAuthor = `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(skill.author || 'anon')}&backgroundColor=transparent`;
  const tags = skill.tags || [];

  function handleInstall() {
    navigator.clipboard.writeText(`claude skills add ${skill.name}`).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  return (
    <AnimatePresence>
      <>
        {/* Backdrop */}
        <motion.div
          key="sk-backdrop"
          initial={{ opacity:0 }} animate={{ opacity:1 }} exit={{ opacity:0 }}

          style={{ position:'fixed', inset:0, zIndex:200, background:'rgba(0,0,0,0.38)', backdropFilter:'blur(4px)', WebkitBackdropFilter:'blur(4px)' }}
        />
        {/* Panel */}
        <motion.div
          key="sk-panel"
          initial={{ x:'100%' }} animate={{ x:0 }} exit={{ x:'100%' }}
          transition={{ type:'spring', damping:28, stiffness:280 }}
          className="skill-detail-panel lg-s"
          style={{ position:'fixed', top:0, right:0, bottom:0, width:'min(82vw, 740px)', zIndex:201, borderRadius:'28px 0 0 28px', background:'var(--bg)', display:'flex', flexDirection:'column' }}
        >
          {/* Sticky top bar */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'16px 20px 0', flexShrink:0 }}>
            <button onClick={toggleDream}
              style={{ display:'flex', alignItems:'center', gap:7, padding:'7px 14px', borderRadius:9999, border:`1px solid ${dreamed ? 'var(--accent)' : 'var(--border)'}`, background: dreamed ? 'rgba(212,102,26,0.09)' : 'transparent', color: dreamed ? 'var(--accent)' : 'var(--text-2)', fontFamily:'JetBrains Mono', fontSize:'.68rem', cursor:'pointer', transition:'all 0.18s' }}>
              {dreamed ? '✦ Dreamed' : '✧ Dream'}
            </button>
            <button onClick={onClose} className="lg" style={{ width:34, height:34, borderRadius:'50%', border:'none', display:'flex', alignItems:'center', justifyContent:'center', fontSize:14, color:'var(--text-2)', cursor:'pointer' }}>✕</button>
          </div>

              <img src={dicebearIcon} alt="" style={{ width:88, height:88, borderRadius:22, flexShrink:0, background:'var(--bg-1)' }} />

            <span style={{ fontFamily:'JetBrains Mono', fontSize:'.58rem', color:'var(--text-2)', border:'1px solid var(--border)', borderRadius:9999, padding:'2px 8px' }}>
              {skill.source}
            </span>
          )}
        </div>
      )}

      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:'auto', paddingTop:4 }}>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:'.62rem', color:'var(--text-2)' }}>{timeAgoStr(skill.updatedAt)}</span>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:'.63rem', color:'var(--accent)' }}>View →</span>
      </div>
    </motion.div>
  );
}

function getStaticSkills(occupationId, searchQ) {
  if (searchQ && searchQ.trim()) {
    const q = searchQ.trim().toLowerCase();
    return STATIC_SKILLS.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.description.toLowerCase().includes(q) ||
      (s.tags || []).some(t => t.includes(q))
    ).slice(0, 18);
  }
  return STATIC_SKILLS.filter(s => s.occupationId === occupationId);
}

/* ===== Skills Grid + generated catalog ===== */
function SkillsPane({ occupation, occupationStats, searchQ, onSelect, catalogSkills = [], catalogState }) {
  const [page, setPage] = useState(1);
  const LIMIT = 18;
  const state = catalogState || { status:'loading', skills:[], meta:null, lastLoadedAt:null, error:null };
  const upstreamCount = Number(occupationStats?.rawCount || 0);
  const localMirrorCount = Number.isFinite(Number(occupationStats?.localCount)) ? Number(occupationStats.localCount) : 0;
  const requestedTotal = searchQ.trim() ? 0 : Math.max(localMirrorCount, 0);
  const totalPages = Math.max(1, Math.ceil((requestedTotal || 1) / LIMIT));
  const currentPage = searchQ.trim() ? page : Math.min(page, totalPages);
  const shardState = useOccupationShard(occupation, currentPage, LIMIT);
  const shardSkills = shardState?.skills || [];
  const mergedSkills = useMemo(() => mergeSkills(shardSkills, catalogSkills, STATIC_SKILLS), [shardSkills, catalogSkills]);
  const filteredSkills = useMemo(() => filterCatalogSkills(mergedSkills, occupation, searchQ), [mergedSkills, occupation, searchQ]);
  const localTotal = searchQ.trim() ? filteredSkills.length : (shardState?.manifest?.totalSkills ?? localMirrorCount ?? filteredSkills.length);
  const pageStart = (currentPage - 1) * LIMIT;
  const shardStart = (shardState?.shardIndex || 0) * (shardState?.shardSize || 500);
  const shardOffset = Math.max(0, pageStart - shardStart);
  const visibleSkills = searchQ.trim()
    ? filteredSkills.slice((currentPage - 1) * LIMIT, currentPage * LIMIT)
    : shardState?.manifest
      ? shardSkills.slice(shardOffset, shardOffset + LIMIT)
      : filteredSkills.slice((currentPage - 1) * LIMIT, currentPage * LIMIT);
  const displayTotalPages = Math.max(1, Math.ceil((searchQ.trim() ? filteredSkills.length : localTotal || filteredSkills.length) / LIMIT));
  const scanner = state.meta?.scannerSummary;
  const catalogCount = state.meta?.totalSkills || catalogSkills.length;
  const shardCount = shardState?.manifest?.totalSkills || shardSkills.length;
  const projectedShardCount = Number(shardState?.manifest?.projectedShardCount || shardState?.manifest?.shardCount || 0);
  const shardProgressLabel = projectedShardCount
    ? `${Number(shardState?.manifest?.shardCount || 0).toLocaleString()} of ${projectedShardCount.toLocaleString()} projected shards`
    : `${Number(shardState?.manifest?.shardCount || 0).toLocaleString()} shards`;
  const nextMissingShard = Number(shardState?.manifest?.nextMissingShard || 0);
  const missingShardLabel = nextMissingShard ? `next missing shard ${nextMissingShard.toLocaleString()}` : 'mirror queue current';
  const rootMissingShards = Number(shardState?.rootManifest?.missingShardCount || 0);
  const rootQueueLabel = rootMissingShards ? `${rootMissingShards.toLocaleString()} shards queued globally` : 'global queue current';
  const coverage = Number(occupationStats?.coveragePercent || 0);
  const mirrorStatus = occupationStats?.mirrorStatus || (upstreamCount > localTotal ? 'sampled' : 'partial');
  const occupationTotalLabel = searchQ.trim()
    ? `${filteredSkills.length.toLocaleString()} local search matches`
    : upstreamCount
      ? `${upstreamCount.toLocaleString()} indexed on SkillsMP · ${localMirrorCount.toLocaleString()} mirrored here · ${coverage}% coverage · ${mirrorStatus}`
      : `${localTotal.toLocaleString()} loaded locally`;

  useEffect(() => { setPage(1); }, [occupation, searchQ]);

  return (
    <div>
      <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:18, padding:'10px 16px', borderRadius:12, background:'rgba(26,122,74,0.06)', border:'1px solid rgba(26,122,74,0.16)', flexWrap:'wrap' }}>
        <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'#1A7A4A' }}>Agentic live catalog</span>
        <span style={{ fontFamily:'DM Sans', fontSize:'.75rem', color:'var(--text-2)' }}>
          {occupationTotalLabel} · shard {shardState?.status || 'idle'} · {shardCount.toLocaleString()} in group shard · {shardProgressLabel} · {missingShardLabel} · {rootQueueLabel} · local catalog {state.status} · {catalogCount || mergedSkills.length} generated · refreshed {formatCatalogTime(state.lastLoadedAt)}
          {scanner ? ` · scanned ${scanner.scanned} · review ${scanner.review} · blocked ${scanner.block}` : ''}
        </span>
        {!searchQ.trim() && occupationStats?.sourceUrl && (
          <a href={occupationStats.sourceUrl} target="_blank" style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'#1A7A4A', textDecoration:'underline' }}>
            Full SkillsMP group
          </a>
        )}
      </div>
      {visibleSkills.length ? (
        <div className="grid-3">
          {visibleSkills.map((s, i) => <SkillCard key={s.id} skill={s} index={i} onSelect={onSelect} />)}
        </div>
      ) : (
        <div style={{ textAlign:'center', padding:'48px 0', border:'1px solid var(--border)', borderRadius:12 }}>
          <p style={{ fontFamily:'JetBrains Mono', fontSize:'.85rem', color:'var(--text-2)', marginBottom:8 }}>
            {searchQ ? `No local mirror results for "${searchQ}"` : 'No locally mirrored cards for this group yet.'}
          </p>
          {!searchQ.trim() && occupationStats?.sourceUrl && (
            <a href={occupationStats.sourceUrl} target="_blank" style={{ fontFamily:'JetBrains Mono', fontSize:'.72rem', color:'var(--accent)', textDecoration:'underline' }}>
              Open the full SkillsMP group
            </a>
          )}
        </div>
      )}
      {/* Pagination */}
      {displayTotalPages > 1 && (
        <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:8, marginTop:40 }}>
          <button className="page-btn" disabled={currentPage<=1} onClick={() => setPage(p=>p-1)}>←</button>
          {[...Array(Math.min(displayTotalPages, 7))].map((_, i) => {
            const p = i + 1;
            return (
              <button key={p} className={`page-btn${currentPage===p?' active':''}`} onClick={() => setPage(p)}>{p}</button>
            );
          })}
          {displayTotalPages > 7 && <span style={{ fontFamily:'JetBrains Mono', fontSize:'.72rem', color:'var(--text-2)' }}>…</span>}
          <button className="page-btn" disabled={currentPage>=displayTotalPages} onClick={() => setPage(p=>p+1)}>→</button>
        </div>
      )}
    </div>
  );
}

                </span>
                <h1 className="t-display" style={{ fontSize:'clamp(2.8rem,6vw,5.5rem)', color:'var(--text)', lineHeight:.9 }}>
                  Skills by<br/>Occupation
                </h1>
              </div>
              {/* Search */}
              <div className="search-wrap" style={{ maxWidth:380, width:'100%' }}>
                <input
                  className="search-input"
                  type="text"
                  placeholder="Search any skill…"
                  value={searchQ}
                  onChange={e => setSearchQ(e.target.value)}
                />
                <span className="search-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                  </svg>
                </span>
              </div>
            </motion.div>

            {/* Attribution */}
            <p style={{ marginTop:16, fontFamily:'DM Sans', fontSize:'.82rem', color:'var(--text-2)' }}>
              Powered by <a href="https://skillsmp.com" target="_blank" style={{ color:'var(--accent)', fontFamily:'JetBrains Mono', fontSize:'.8rem' }}>skillsmp.com</a> — 23 occupation groups · 867 occupations
            </p>
            <p style={{ marginTop:8, fontFamily:'JetBrains Mono', fontSize:'.68rem', color:'var(--text-2)' }}>
                Agentic live catalog: {catalogState.status} · {(catalogState.meta?.totalSkills || catalogState.skills.length || STATIC_SKILLS.length).toLocaleString()} skills · refreshed {formatCatalogTime(catalogState.lastLoadedAt)}
                {headerScanner ? ` · scanned ${headerScanner.scanned} · review ${headerScanner.review} · blocked ${headerScanner.block}` : ''}
                {occupationCountsState.meta ? ` · SkillsMP ${occupationCountsState.meta.totalMajorGroups} groups · ${occupationCountsState.meta.totalOccupations} occupations · ${occupationCountsState.meta.classifiedPercent || 0}% classified` : ''}
              </p>
          </div>
        </div>

        {/* Sidebar + content */}
        <div className="section-sm">
          <div className="container">
            <TrendingRow onSelect={setSelectedSkill} catalogSkills={catalogState.skills} />
            <div className="sidebar-layout">
              {/* Sidebar */}
              <aside className="sidebar">
                <p className="sidebar__label" style={{ fontFamily:'JetBrains Mono', fontSize:'.63rem', textTransform:'uppercase', letterSpacing:'.09em', color:'var(--text-2)', marginBottom:10, padding:'0 8px' }}>
                  Occupation Groups
                </p>
                {occupations.map(occ => (
                  <button
                    key={occ.id}
                    onClick={() => { setActiveOcc(occ); setSearchQ(''); }}
                    style={{
                      width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
                      padding:'8px 10px', borderRadius:10, border:'none', cursor:'pointer',
                      background: activeOcc.id === occ.id ? 'var(--bg-1,rgba(0,0,0,0.06))' : 'transparent',
                      color: activeOcc.id === occ.id ? 'var(--text)' : 'var(--text-2)',
                      fontFamily:'DM Sans', fontSize:'.82rem',
                      fontWeight: activeOcc.id === occ.id ? '500' : '400',
                      transition:'all 0.15s',
                      textAlign:'left',
                    }}
                  >
                    <span style={{ display:'flex', alignItems:'center', gap:8 }}>
                      <span style={{ fontFamily:'JetBrains Mono', fontSize:'.6rem', color:'var(--text-2)', width:22, flexShrink:0 }}>#{occ.id}</span>
                      <span style={{ lineHeight:1.3 }}>{occ.label}</span>
                    </span>
                    <span style={{ fontFamily:'JetBrains Mono', fontSize:'.6rem', color:'var(--text-2)', flexShrink:0, paddingLeft:4 }}>{occ.count}</span>
                  </button>
                ))}
              </aside>

              {/* Main content */}
              <div>
                <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:28, flexWrap:'wrap' }}>
                  <h2 className="t-heading" style={{ fontSize:'1.3rem', color:'var(--text)' }}>
                    {searchQ.trim() ? `"${searchQ}"` : activeOccupation.label}
                  </h2>
                  {!searchQ.trim() && (
                    <div className="lg" style={{ borderRadius:9999, padding:'4px 12px' }}>
                      <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'var(--text-2)' }}>Group #{activeOccupation.id}</span>
                    </div>
                  )}
                  {!searchQ.trim() && activeOccupation.rawCount && (
                    <div className="lg" style={{ borderRadius:9999, padding:'4px 12px' }}>
                      <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'var(--accent)' }}>{Number(activeOccupation.rawCount).toLocaleString()} indexed</span>
                    </div>
                  )}
                  {!searchQ.trim() && Number.isFinite(Number(activeOccupation.localCount)) && (
                    <div className="lg" style={{ borderRadius:9999, padding:'4px 12px' }}>
                      <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'var(--text-2)' }}>{Number(activeOccupation.localCount).toLocaleString()} mirrored</span>
                    </div>
                  )}
                </div>

                <SkillsPane
                  occupation={activeOcc.id}
                  occupationStats={activeOccupation}
                  searchQ={searchQ}
                  onSelect={setSelectedSkill}
                  catalogSkills={catalogState.skills}
                  catalogState={catalogState}
                />
              </div>
            </div>
          </div>
        </div>
      </main>

      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
