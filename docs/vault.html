const { useState, useEffect, useRef } = React;

/* ===== Static Supabase Auth ===== */
const AUTH_CONFIG_URL = 'data/auth-config.json';
let staticSupabaseClient = null;

async function loadAuthConfig() {
  if (window.SKILLSCALE_AUTH_CONFIG?.supabaseUrl && window.SKILLSCALE_AUTH_CONFIG?.supabaseAnonKey) {
    return window.SKILLSCALE_AUTH_CONFIG;
  }
  try {
    const resp = await fetch(`${AUTH_CONFIG_URL}?t=${Date.now()}`, { cache:'no-store' });
    if (!resp.ok) return null;
    const config = await resp.json();
    return config?.supabaseUrl && config?.supabaseAnonKey ? config : null;
  } catch {
    return null;
  }
}

function getAuthRedirectUrl() {
  const url = new URL(window.location.href);
  url.hash = '';
  url.search = '';
  return url.toString();
}

function getDisplayName(user) {
  if (!user) return '';
  return user.user_metadata?.full_name || user.user_metadata?.name || user.user_metadata?.user_name || user.email || 'Skillscale user';
}

function getInitials(name) {
  return (name || 'S')
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map(part => part[0]?.toUpperCase())
    .join('') || 'S';
}

function useStaticAuth() {
  const [client, setClient] = useState(null);
  const [configured, setConfigured] = useState(false);
  const [loading, setLoading] = useState(true);
  const [user, setUser] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let alive = true;
    let subscription = null;

    async function init() {
      const config = await loadAuthConfig();
      if (!alive) return;
      if (!config || !window.supabase?.createClient) {
        setConfigured(false);
        setLoading(false);
        return;
      }

      staticSupabaseClient = staticSupabaseClient || window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
        auth: { detectSessionInUrl:true, persistSession:true, autoRefreshToken:true, flowType:'implicit' }
      });
      setClient(staticSupabaseClient);
      setConfigured(true);

      const { data, error: sessionError } = await staticSupabaseClient.auth.getSession();
      if (!alive) return;
      if (sessionError) setError(sessionError.message);
      setUser(data.session?.user || null);

      const listener = staticSupabaseClient.auth.onAuthStateChange((_event, session) => {
        setUser(session?.user || null);
        setError(null);
        setLoading(false);
      });
      subscription = listener.data.subscription;
      setLoading(false);
    }

    init();
    return () => {
      alive = false;
      if (subscription) subscription.unsubscribe();
    };
  }, []);

  async function signInWithOAuth(provider) {
    setError(null);
    if (!client) {
      setError('Supabase Auth is not configured for this static page.');
      return;
    }
    const { error: oauthError } = await client.auth.signInWithOAuth({
      provider,
      options: {
        redirectTo: getAuthRedirectUrl(),
        queryParams: provider === 'google' ? { prompt:'select_account' } : undefined,
      }
    });
    if (oauthError) setError(oauthError.message);
  }

  async function signInWithEmail(email) {
    setError(null);
    if (!client) {
      setError('Supabase Auth is not configured for this static page.');
      return false;
    }
    const { error: emailError } = await client.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: getAuthRedirectUrl() }
    });
    if (emailError) {
      setError(emailError.message);
      return false;
    }
    return true;
  }

  async function signInWithPassword(email, password) {
    setError(null);
    if (!client) {
      setError('Supabase Auth is not configured for this static page.');
      return false;
    }
    const { error: passwordError } = await client.auth.signInWithPassword({ email, password });
    if (passwordError) {
      setError(passwordError.message);
      return false;
    }
    return true;
  }

  async function signUpWithPassword(email, password) {
    setError(null);
    if (!client) {
      setError('Supabase Auth is not configured for this static page.');
      return false;
    }
    const { error: signUpError } = await client.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: getAuthRedirectUrl() }
    });
    if (signUpError) {
      setError(signUpError.message);
      return false;
    }
    return true;
  }

  async function signOut() {
    if (!client) return;
    const { error: signOutError } = await client.auth.signOut();
    if (signOutError) setError(signOutError.message);
  }

  return { client, configured, loading, user, error, signInWithOAuth, signInWithEmail, signInWithPassword, signUpWithPassword, signOut, clearError:() => setError(null) };
}

/* ===== Vault storage ===== */
const VAULT_KEY = 'skillscale_vault';
function getVault() {
  try { return JSON.parse(localStorage.getItem(VAULT_KEY) || '{"dreamed":[],"owned":[]}'); }
  catch { return { dreamed:[], owned:[] }; }
}
function saveVault(v) { localStorage.setItem(VAULT_KEY, JSON.stringify(v)); }

function vaultItemToRow(userId, collection, item) {
  return {
    user_id: userId,
    item_id: String(item.id),
    collection,
    name: item.name || item.id,
    author: item.author || null,
    score: Number.isFinite(Number(item.score)) ? Number(item.score) : null,
    tier: item.tier || null,
    note: item.note || '',
    saved_at: item.savedAt || new Date().toISOString(),
    payload: item,
  };
}

function rowToVaultItem(row) {
  const payload = row.payload && typeof row.payload === 'object' ? row.payload : {};
  return {
    ...payload,
    id: row.item_id,
    name: row.name || payload.name || row.item_id,
    author: row.author || payload.author || '',
    score: row.score ?? payload.score,
    tier: row.tier || payload.tier,
    note: row.note || '',
    savedAt: row.saved_at || payload.savedAt || new Date().toISOString(),
  };
}

function mergeVaults(localVault, remoteRows) {
  const next = {
    dreamed: [...(localVault.dreamed || [])],
    owned: [...(localVault.owned || [])],
  };
  for (const row of remoteRows || []) {
    const collection = row.collection === 'owned' ? 'owned' : 'dreamed';
    const item = rowToVaultItem(row);
    const index = next[collection].findIndex(existing => existing.id === item.id);
    if (index >= 0) next[collection][index] = { ...next[collection][index], ...item };
    else next[collection].push(item);
  }
  return next;
}

async function syncVaultWithSupabase(client, user) {
  if (!client || !user?.id) return getVault();
  const localVault = getVault();
  const localRows = [
    ...(localVault.dreamed || []).map(item => vaultItemToRow(user.id, 'dreamed', item)),
    ...(localVault.owned || []).map(item => vaultItemToRow(user.id, 'owned', item)),
  ];
  if (localRows.length) {
    const { error: upsertError } = await client.from('vault_items').upsert(localRows, { onConflict:'user_id,item_id,collection' });
    if (upsertError) throw upsertError;
  }
  const { data, error } = await client
    .from('vault_items')
    .select('item_id,collection,name,author,score,tier,note,saved_at,payload')
    .eq('user_id', user.id)
    .order('saved_at', { ascending:false });
  if (error) throw error;
  const merged = mergeVaults(localVault, data || []);
  saveVault(merged);
  return merged;
}

async function persistVaultItem(client, user, collection, item) {
  if (!client || !user?.id) return;
  const { error } = await client.from('vault_items').upsert(vaultItemToRow(user.id, collection, item), { onConflict:'user_id,item_id,collection' });
  if (error) throw error;
}

async function deleteVaultItem(client, user, collection, id) {
  if (!client || !user?.id) return;
  const { error } = await client
    .from('vault_items')
    .delete()
    .eq('user_id', user.id)
    .eq('collection', collection)
    .eq('item_id', id);
  if (error) throw error;
}

/* ===== SecureScore tier ===== */
const SCORE_TIER_CONFIG = {
  diamond: { label:'Legendary', color:'#00B0BA', icon:'🌟' },
  emerald: { label:'Epic',      color:'#4B5CC4', icon:'⚡' },
  pearl:   { label:'Rare',      color:'#1565C0', icon:'💎' },
  quartz:  { label:'Standard',  color:'#2D6A4F', icon:'🌿' },
  coal:    { label:'Draft',     color:'#6A6460', icon:'⬜' },
};
function scoreTier(score) {
  if (score >= 90) return 'diamond';
  if (score >= 80) return 'emerald';
  if (score >= 65) return 'pearl';
  if (score >= 50) return 'quartz';
  return 'coal';
}

            </div>

/* ===== Vault Item ===== */
function VaultItem({ item, onRemove, onNoteChange }) {
  const [editing, setEditing] = useState(false);
  const [note, setNote] = useState(item.note || '');
  const tier = item.tier || scoreTier(item.score || 70);
  const cfg = SCORE_TIER_CONFIG[tier];

  function saveNote() {
    onNoteChange(item.id, note);
    setEditing(false);
  }

  const relDate = (() => {
    const d = Math.floor((Date.now() - new Date(item.savedAt).getTime()) / 86400000);
    if (d < 1) return 'today';
    if (d === 1) return '1d ago';
    if (d < 7) return `${d}d ago`;
    return `${Math.floor(d/7)}w ago`;
  })();

  return (
    <motion.div
      layout
      initial={{ opacity:0, y:12 }} animate={{ opacity:1, y:0 }} exit={{ opacity:0, scale:0.95 }}
      transition={{ duration:0.28 }}
      className="lg"
      style={{ borderRadius:16, padding:20, display:'flex', flexDirection:'column', gap:12 }}
    >
      <div style={{ display:'flex', alignItems:'flex-start', gap:14 }}>
        <img src={`https://api.dicebear.com/7.x/shapes/svg?seed=${encodeURIComponent(item.name || item.id)}`}
          alt="" style={{ width:44, height:44, borderRadius:11, flexShrink:0, background:'var(--bg-1)' }} />
        <div style={{ flex:1, minWidth:0 }}>
          <span style={{ fontFamily:'JetBrains Mono', fontWeight:700, fontSize:'.82rem', color:'var(--text)', display:'block', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
            /{item.name || item.id}
          </span>
          {item.author && (
            <span style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', color:'var(--accent)' }}>@{item.author}</span>
          )}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:'.62rem', color:'var(--text-2)' }}>{relDate}</span>
          <span style={{ fontFamily:'JetBrains Mono', fontSize:'.62rem', padding:'2px 8px', borderRadius:9999, background: cfg.color + '18', color: cfg.color, border:`1px solid ${cfg.color}30` }}>
            {cfg.icon} {cfg.label}
          </span>
        </div>
      </div>

      {/* SecureScore mini bar */}
      {item.score != null && (
        <div>
          <div style={{ display:'flex', justifyContent:'space-between', marginBottom:4 }}>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:'.58rem', color:'var(--text-2)', textTransform:'uppercase', letterSpacing:'.06em' }}>SecureScore</span>
            <span style={{ fontFamily:'JetBrains Mono', fontSize:'.62rem', fontWeight:700, color: cfg.color }}>{item.score}</span>
          </div>
          <div style={{ height:5, borderRadius:9999, background:'var(--border)', overflow:'hidden', position:'relative' }}>
            <div style={{ position:'absolute', height:'100%', borderRadius:9999, background:'linear-gradient(90deg, #C0392B 0%, #0065A2 30%, #27AE60 65%, #1E6091 100%)', backgroundSize:'500px 100%', width:`${item.score}%` }} />
          </div>
        </div>
      )}

      {/* Private note */}
      <div>
        {editing ? (
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            <textarea
              value={note} onChange={e => setNote(e.target.value)}
              placeholder="Add a private note…"
              rows={2}
              style={{ fontFamily:'DM Sans', fontSize:'.8rem', color:'var(--text)', background:'var(--bg)', border:'1px solid var(--border)', borderRadius:10, padding:'8px 12px', resize:'vertical', outline:'none', lineHeight:1.5, width:'100%' }}
            />
            <div style={{ display:'flex', gap:8 }}>
              <button onClick={saveNote} className="btn btn-primary btn-sm" style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem' }}>Save</button>
              <button onClick={() => { setEditing(false); setNote(item.note||''); }} className="btn btn-sm lg" style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', border:'1px solid var(--border)' }}>Cancel</button>
            </div>
          </div>
        ) : (
          <div onClick={() => setEditing(true)} style={{ cursor:'pointer', padding:'8px 12px', borderRadius:10, background:'var(--bg)', border:'1px dashed var(--border)', minHeight:36, display:'flex', alignItems:'center' }}>
            {note ? (
              <p style={{ fontFamily:'DM Sans', fontSize:'.8rem', color:'var(--text-2)', margin:0, lineHeight:1.4 }}>{note}</p>
            ) : (
              <span style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', color:'var(--text-2)', opacity:.6 }}>+ Add private note…</span>
            )}
          </div>
        )}
      </div>

      {/* Actions */}
      <div style={{ display:'flex', gap:8 }}>
        <a href={`skills.html`} className="btn btn-sm lg" style={{ flex:1, fontFamily:'JetBrains Mono', fontSize:'.68rem', textAlign:'center', border:'1px solid var(--border)', textDecoration:'none' }}>
          View
        </a>
        <a href={`market.html#create`} className="btn btn-sm" style={{ flex:1, fontFamily:'JetBrains Mono', fontSize:'.68rem', textAlign:'center', background:'rgba(23,124,176,0.08)', color:'var(--accent)', border:'1px solid rgba(23,124,176,0.25)', textDecoration:'none' }}>
          Publish →
        </a>
        <button onClick={() => onRemove(item.id)}
          style={{ padding:'7px 12px', borderRadius:10, border:'1px solid var(--border)', background:'transparent', color:'var(--text-2)', cursor:'pointer', fontSize:'.78rem', transition:'all 0.15s', flexShrink:0 }}
          title="Remove from Vault">
          ✕
        </button>
      </div>
    </motion.div>
  );
}

/* ===== Empty State ===== */
function EmptyState({ tab }) {
  return (
    <motion.div initial={{ opacity:0, y:16 }} animate={{ opacity:1, y:0 }} transition={{ duration:0.4 }}
      style={{ textAlign:'center', padding:'64px 24px', display:'flex', flexDirection:'column', alignItems:'center', gap:16 }}>
      <span style={{ fontSize:'3rem' }}>{tab === 'dreamed' ? '✧' : '🔒'}</span>
      <h3 style={{ fontFamily:'Archivo Black', fontSize:'1.4rem', color:'var(--text)', margin:0 }}>
        {tab === 'dreamed' ? 'Your Dreamed skills live here' : 'No owned skills yet'}
      </h3>
      <p style={{ fontFamily:'DM Sans', fontSize:'.9rem', color:'var(--text-2)', maxWidth:340, lineHeight:1.6, margin:0 }}>
        {tab === 'dreamed'
          ? 'Hit ✧ Dream on any skill in the marketplace to save it privately here.'
          : 'Purchase a skill from the marketplace to see it here.'}
      </p>
      <div style={{ display:'flex', gap:12, flexWrap:'wrap', justifyContent:'center' }}>
        <a href="skills.html" className="btn btn-primary" style={{ fontFamily:'JetBrains Mono', fontSize:'.72rem', padding:'9px 20px' }}>Browse Skills</a>
        <a href="market.html" className="btn lg" style={{ fontFamily:'JetBrains Mono', fontSize:'.72rem', padding:'9px 20px', border:'1px solid var(--border)' }}>Go to Market</a>
      </div>
    </motion.div>
  );
}

/* ===== App ===== */
function App() {
  const [theme, setTheme] = useState(() => {
    const s = localStorage.getItem('sk-theme');
    if (s) return s;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  });
  const [tab, setTab] = useState('dreamed');
  const [vault, setVault] = useState(getVault);
  const [cloudStatus, setCloudStatus] = useState('local');
  const auth = useStaticAuth();

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('sk-theme', theme);
  }, [theme]);

  useEffect(() => {
    let alive = true;
    if (!auth.client || !auth.user) {
      setCloudStatus('local');
      return;
    }
    setCloudStatus('syncing');
    syncVaultWithSupabase(auth.client, auth.user)
      .then(nextVault => {
        if (!alive) return;
        setVault(nextVault);
        setCloudStatus('cloud');
      })
      .catch(() => {
        if (alive) setCloudStatus('error');
      });
    return () => { alive = false; };
  }, [auth.client, auth.user?.id]);

  function refresh() { setVault(getVault()); }

  async function removeItem(id) {
    const v = getVault();
    const collection = tab === 'dreamed' ? 'dreamed' : 'owned';
    if (collection === 'dreamed') v.dreamed = v.dreamed.filter(s => s.id !== id);
    else v.owned = v.owned.filter(s => s.id !== id);
    saveVault(v);
    refresh();
    try {
      await deleteVaultItem(auth.client, auth.user, collection, id);
      if (auth.user) setCloudStatus('cloud');
    } catch {
      if (auth.user) setCloudStatus('error');
    }
  }

  async function updateNote(id, note) {
    const v = getVault();
    const arr = tab === 'dreamed' ? v.dreamed : v.owned;
    const item = arr.find(s => s.id === id);
    if (item) item.note = note;
    saveVault(v);
    refresh();
    try {
      if (item) await persistVaultItem(auth.client, auth.user, tab === 'dreamed' ? 'dreamed' : 'owned', item);
      if (auth.user) setCloudStatus('cloud');
    } catch {
      if (auth.user) setCloudStatus('error');
    }
  }

  const items = tab === 'dreamed' ? vault.dreamed : vault.owned;
  const totalCount = vault.dreamed.length + vault.owned.length;

  return (
    <>
      <Nav theme={theme} onToggle={() => setTheme(t => t==='light'?'dark':'light')} auth={auth} />

      <main style={{ background:'var(--bg)', minHeight:'100vh' }}>
        {/* Header */}
        <div className="page-top" style={{ borderBottom:'1px solid var(--border)', paddingBottom:40 }}>
          <div className="container" style={{ paddingTop:40 }}>
            <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', flexWrap:'wrap', gap:20 }}>
              <div>
                <span style={{ fontFamily:'JetBrains Mono', fontSize:'.7rem', letterSpacing:'.08em', color:'var(--accent)', textTransform:'uppercase', display:'block', marginBottom:10 }}>
                  // Private Storage
                </span>
                <h1 className="t-display" style={{ fontSize:'clamp(2.8rem,6vw,5rem)', color:'var(--text)', lineHeight:.9 }}>
                  ✦ Your Vault
                </h1>
              </div>
              <div className="lg" style={{ padding:'10px 18px', borderRadius:14, display:'flex', alignItems:'center', gap:10 }}>
                <span style={{ fontSize:'1.1rem' }}>{auth.user ? '✓' : '🔒'}</span>
                <div>
                  <div style={{ fontFamily:'JetBrains Mono', fontSize:'.65rem', fontWeight:600, color:'var(--text)' }}>{auth.user ? 'Signed in' : 'Private & local'}</div>
                  <div style={{ fontFamily:'DM Sans', fontSize:'.75rem', color:'var(--text-2)' }}>{auth.user ? `${getDisplayName(auth.user)} · ${cloudStatus === 'cloud' ? 'synced to Supabase' : cloudStatus === 'syncing' ? 'syncing vault' : cloudStatus === 'error' ? 'local fallback active' : 'stored on this device'}` : 'Sign in to sync privately with Supabase · stored on this device'}</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div className="section-sm">
          <div className="container">
            {/* Tabs */}
            <div style={{ display:'flex', gap:4, marginBottom:32, background:'var(--bg-1,rgba(0,0,0,0.05))', borderRadius:12, padding:4, width:'fit-content' }}>
              {[['dreamed', `✧ Dreamed (${vault.dreamed.length})`], ['owned', `🔒 Owned (${vault.owned.length})`]].map(([t, label]) => (
                <button key={t} onClick={() => setTab(t)}
                  style={{ fontFamily:'JetBrains Mono', fontSize:'.72rem', padding:'8px 20px', borderRadius:9, border:'none', cursor:'pointer', transition:'all 0.18s',
                    background: tab===t ? 'var(--bg)' : 'transparent',
                    color: tab===t ? 'var(--text)' : 'var(--text-2)',
                    boxShadow: tab===t ? '0 1px 6px rgba(0,0,0,0.1)' : 'none',
                    fontWeight: tab===t ? '500' : '400' }}>
                  {label}
                </button>
              ))}
            </div>

            {/* Grid */}
            {items.length === 0 ? (
              <EmptyState tab={tab} />
            ) : (
              <div>
                <p style={{ fontFamily:'JetBrains Mono', fontSize:'.68rem', color:'var(--text-2)', marginBottom:20 }}>
                  {items.length} skill{items.length !== 1 ? 's' : ''} · {tab === 'dreamed' ? 'saved privately, not published' : 'purchased'}
                </p>
                <div className="grid-3">
                  <AnimatePresence mode="popLayout">
                    {items.map(item => (
                      <VaultItem key={item.id} item={item} onRemove={removeItem} onNoteChange={updateNote} />
                    ))}
                  </AnimatePresence>
                </div>
              </div>
            )}
          </div>
        </div>
      </main>

      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
