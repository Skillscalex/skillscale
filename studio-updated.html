/* ── Streaming fetch ────────────────────────────────────────────── */
async function fetchAgentStream({ message, agentId, conversationHistory, onToken, onDone, onError }) {
  try {
    const resp = await fetch(`${API_BASE_URL}/api/studio/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, agentId, conversationHistory }),
    });

    if (!resp.ok) {
      const errText = await resp.text().catch(() => `HTTP ${resp.status}`);
      throw new Error(errText);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() ?? '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        try {
          const parsed = JSON.parse(raw);
          if (parsed.type === 'token' && parsed.content) {
            onToken(parsed.content);
          } else if (parsed.type === 'done') {
            onDone(parsed.usage ?? null);
          } else if (parsed.type === 'error') {
            onError(new Error(parsed.error || 'Agent error'));
          }
        } catch { /* malformed chunk */ }
      }
    }
  } catch (err) {
    onError(err);
  }
}

/* ── Chat window with real streaming ────────────────────────────── */
function ChatWindow({agent,onVoiceCall,onVideoCall}){
  const [messages,setMessages]=useState([]);
  const [isTyping,setIsTyping]=useState(false);
  const [isStreaming,setIsStreaming]=useState(false);
  // Per-agent conversation history (only real exchanges, not intro messages)
  const [convHistory,setConvHistory]=useState({});
  const scrollRef=useRef(null);

  // Load intro messages when agent changes
  useEffect(()=>{
    const intro=AGENT_INTROS[agent.id]||[{id:1,from:'agent',text:`Hi, I'm ${agent.name}. How can I help?`,time:now()}];
    setMessages(intro.map(m=>({...m,time:now()})));
  },[agent.id]);

  useEffect(()=>{
    if(scrollRef.current) scrollRef.current.scrollTop=scrollRef.current.scrollHeight;
  },[messages,isTyping]);

  async function handleSend(text){
    const t=now();
    const userMsg={id:Date.now(),from:'user',text,time:t};
    setMessages(prev=>[...prev,userMsg]);
    setIsTyping(true);

    const agentHistory=convHistory[agent.id]||[];
    const streamingId=Date.now()+1;
    let fullText='';

    await fetchAgentStream({
      message: text,
      agentId: agent.id,
      conversationHistory: agentHistory,
      onToken: (token) => {
        if(isTyping){
          setIsTyping(false);
          setIsStreaming(true);
          setMessages(prev=>[...prev,{id:streamingId,from:'agent',text:'',time:now(),streaming:true}]);
        }
        fullText+=token;
        setMessages(prev=>prev.map(m=>m.id===streamingId?{...m,text:fullText}:m));
      },
      onDone: () => {
        setIsTyping(false);
        setIsStreaming(false);
        setMessages(prev=>prev.map(m=>m.id===streamingId?{...m,streaming:false}:m));
        // Persist to conversation history
        setConvHistory(prev=>({
          ...prev,
          [agent.id]:[
            ...(prev[agent.id]||[]),
            {role:'user',content:text},
            {role:'assistant',content:fullText},
          ],
        }));
      },
      onError: (err) => {
        setIsTyping(false);
        setIsStreaming(false);
        setMessages(prev=>[
          ...prev.filter(m=>m.id!==streamingId),
          {id:streamingId,from:'agent',text:`⚠️ ${err.message || 'Connection error. Is the API server running?'}`,time:now()},
        ]);
      },
    });
  }

  return(
    <div className="chat-area">
      <ChatHeader agent={agent} onVoiceCall={onVoiceCall} onVideoCall={onVideoCall}/>
      <div className="messages-scroll" ref={scrollRef}>
        {messages.map(msg=><MessageBubble key={msg.id} msg={msg} agent={agent}/>)}
        {isTyping&&<TypingIndicator agent={agent}/>}
      </div>
      <ChatInput onSend={handleSend} agent={agent} disabled={isTyping||isStreaming}/>
    </div>
  );
}

            {[0,1,2,3,4,5,6].map(i=><div key={i} className="wave-bar" style={{animation:`wave 1.2s ease-in-out ${i*0.1}s infinite`}}/>)}
          </div>
          <div style={{fontFamily:'JetBrains Mono',fontSize:'.82rem',color:'#ef4444'}}>{fmt(secs)}</div>
        </div>
      )}
      <p style={{fontFamily:'DM Sans',fontSize:'.82rem',color:'var(--text-2)',textAlign:'center',margin:0}}>{rec?'Recording — tap to stop':'Tap to record a voice message'}</p>
      {transcript&&(
        <div style={{width:'100%',padding:'11px 13px',borderRadius:12,border:'1px solid var(--border)',background:'var(--bg-1,rgba(0,0,0,0.03))'}}>
          <div style={{fontFamily:'JetBrains Mono',fontSize:'.58rem',color:'var(--accent)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:5}}>Transcript</div>
          <p style={{fontFamily:'DM Sans',fontSize:'.85rem',color:'var(--text)',margin:0,lineHeight:1.6}}>{transcript}</p>
          <div style={{display:'flex',gap:7,marginTop:10}}>
            <button style={{flex:1,padding:'7px',borderRadius:8,border:'1px solid var(--border)',background:'transparent',color:'var(--text-2)',fontFamily:'JetBrains Mono',fontSize:'.6rem',cursor:'pointer'}}>↓ Save Memo</button>
            <button style={{flex:1,padding:'7px',borderRadius:8,border:'none',background:'var(--accent)',color:'#fff',fontFamily:'JetBrains Mono',fontSize:'.6rem',fontWeight:600,cursor:'pointer'}}>➤ Send to Chat</button>
          </div>
        </div>
      )}
      <div style={{width:'100%',padding:'11px 13px',borderRadius:12,border:'1px solid var(--border)'}}>
        <div style={{fontFamily:'JetBrains Mono',fontSize:'.58rem',color:'var(--text-2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:8}}>Voice Features</div>
        {['Voice messages sent & received','Live transcription via Grok 4.3','Auto-save to Workspace → Memos','Send voice notes to any agent'].map((f,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:i<3?'1px solid var(--border)':'none'}}>
            <span style={{color:'var(--accent)',fontSize:11}}>✓</span>
            <span style={{fontFamily:'DM Sans',fontSize:'.8rem',color:'var(--text-2)'}}>{f}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Video Panel ────────────────────────────────────────────────── */
function VideoPanel({onVideoCall}){
  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'20px 14px',gap:16,overflowY:'auto',height:'100%',boxSizing:'border-box'}}>
      <div style={{width:'100%',aspectRatio:'16/9',borderRadius:12,overflow:'hidden',background:'#0a0a0a',display:'flex',alignItems:'center',justifyContent:'center',position:'relative',border:'1px solid var(--border)'}}>
        <div style={{textAlign:'center'}}><div style={{fontSize:28,marginBottom:7}}>📹</div><p style={{fontFamily:'JetBrains Mono',fontSize:'.65rem',color:'rgba(255,255,255,0.4)',margin:0}}>Camera preview</p></div>
        <div style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',display:'flex',gap:8}}>
          {['🎙','🔇','🔄'].map((ic,i)=>(
            <button key={i} style={{width:32,height:32,borderRadius:'50%',border:'none',background:'rgba(255,255,255,0.15)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:13}}>{ic}</button>
          ))}
        </div>
      </div>
      <button onClick={onVideoCall} style={{width:'100%',padding:'11px',borderRadius:10,border:'none',background:'var(--accent)',color:'#fff',fontFamily:'JetBrains Mono',fontSize:'.75rem',fontWeight:700,cursor:'pointer'}}>📹 Start Video Call</button>
      <div style={{width:'100%'}}>
        <div style={{fontFamily:'JetBrains Mono',fontSize:'.58rem',color:'var(--text-2)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:8}}>Video Features</div>
        {['HD video calls with any agent','Screen sharing during calls','Auto-recording to Workspace','Real-time captions via Grok 4.3'].map((f,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,padding:'5px 0',borderBottom:i<3?'1px solid var(--border)':'none'}}>
            <span style={{color:'var(--accent)',fontSize:11}}>✓</span>
            <span style={{fontFamily:'DM Sans',fontSize:'.8rem',color:'var(--text-2)'}}>{f}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Studio right panel ─────────────────────────────────────────── */
function StudioPanel({onVideoCall}){
  const [mode,setMode]=useState('xsearch');
  const MODES=[{id:'image',label:'Image',icon:'🖼'},{id:'xsearch',label:'X-Search',icon:'𝕏'},{id:'voice',label:'Voice',icon:'🎤'},{id:'video',label:'Video',icon:'📹'}];
  return(
    <div className="studio-right">
      <div style={{display:'flex',borderBottom:'1px solid var(--border)',flexShrink:0}}>
        {MODES.map(m=>(
          <button key={m.id} onClick={()=>setMode(m.id)} className={`studio-tab${mode===m.id?' active':''}`}>
            <span style={{fontSize:15}}>{m.icon}</span>
            <span style={{fontFamily:'JetBrains Mono',fontSize:'.56rem',color:mode===m.id?'var(--accent)':'var(--text-2)',letterSpacing:'.04em'}}>{m.label}</span>
          </button>
        ))}
      </div>
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {mode==='xsearch'&&<XSearchPanel/>}
        {mode==='image'&&<ImageGenPanel/>}
        {mode==='voice'&&<VoicePanel/>}
        {mode==='video'&&<VideoPanel onVideoCall={onVideoCall}/>}
      </div>
    </div>
  );
}

/* ── Call overlay ───────────────────────────────────────────────── */
function CallOverlay({type,agent,onEnd}){
  const [dur,setDur]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setDur(d=>d+1),1000);return()=>clearInterval(t);},[]);
  const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  return(
    <div className="call-overlay" onClick={e=>e.target===e.currentTarget&&onEnd()}>
      <motion.div initial={{scale:0.85,opacity:0}} animate={{scale:1,opacity:1}} exit={{scale:0.85,opacity:0}} transition={{type:'spring',damping:22,stiffness:300}}
        className="lg-s" style={{background:'var(--bg)',borderRadius:28,padding:'44px 38px',textAlign:'center',minWidth:300,display:'flex',flexDirection:'column',alignItems:'center',gap:22}}>
        <div style={{position:'relative'}}>
          <AgentAvatar agent={agent} size={80}/>
          <div style={{position:'absolute',inset:-5,borderRadius:'50%',border:`2px solid ${agent.color}`,animation:'online-pulse 1.5s infinite'}}/>
        </div>
        <div>
          <div style={{fontFamily:'Archivo Black',fontSize:'1.35rem',color:'var(--text)',marginBottom:4}}>{agent.name}</div>
          <div style={{fontFamily:'JetBrains Mono',fontSize:'.68rem',color:'var(--text-2)'}}>{type==='video'?'Video Call':'Voice Call'} · {fmt(dur)}</div>
          <div style={{fontFamily:'JetBrains Mono',fontSize:'.6rem',color:'#16a34a',marginTop:4}}>🔒 End-to-end encrypted</div>
        </div>
        {type==='voice'&&(
          <div style={{display:'flex',alignItems:'flex-end',gap:3,height:28}}>
            {[0,1,2,3,4,5,6,7].map(i=><div key={i} className="wave-bar" style={{animation:`wave 1.2s ease-in-out ${i*0.1}s infinite`}}/>)}
          </div>
        )}
        {type==='video'&&(
          <div style={{width:'100%',height:100,borderRadius:10,background:'#0a0a0a',display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid rgba(255,255,255,0.08)'}}>
            <p style={{fontFamily:'JetBrains Mono',fontSize:'.62rem',color:'rgba(255,255,255,0.35)',margin:0}}>Video stream</p>
          </div>
        )}
        <div style={{display:'flex',gap:12}}>
          <button style={{width:50,height:50,borderRadius:'50%',border:'none',background:'rgba(0,0,0,0.06)',color:'var(--text)',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>🔇</button>
          {type==='video'&&<button style={{width:50,height:50,borderRadius:'50%',border:'none',background:'rgba(0,0,0,0.06)',color:'var(--text)',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>📵</button>}
          <button onClick={onEnd} style={{width:50,height:50,borderRadius:'50%',border:'none',background:'#ef4444',color:'#fff',cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center'}}>📵</button>
        </div>
      </motion.div>
    </div>
  );
}

/* ── App ────────────────────────────────────────────────────────── */
function App(){
  const [theme,setTheme]=useState(()=>localStorage.getItem('sk-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  const [activeAgent,setActiveAgent]=useState(ALL_AGENTS[0]);
  const [sidebarSearch,setSidebarSearch]=useState('');
  const [call,setCall]=useState(null);

  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('sk-theme',theme);},[theme]);

  return(
    <>
      <style>{`
        @keyframes online-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.55;transform:scale(0.82)}}
        @keyframes wave{0%,100%{height:4px}50%{height:18px}}
        .wave-bar{width:3px;background:var(--accent);border-radius:2px;}
        @keyframes shimmer{0%,100%{opacity:1}50%{opacity:0.45}}
        @keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:0.35}30%{transform:translateY(-5px);opacity:1}}
        @keyframes streamCursor{0%,100%{opacity:1}50%{opacity:0}}
        .stream-cursor{display:inline-block;width:2px;height:14px;background:var(--accent);margin-left:2px;vertical-align:middle;animation:streamCursor 0.8s ease-in-out infinite;border-radius:1px;}
      `}</style>
      <Nav theme={theme} onToggle={()=>setTheme(t=>t==='light'?'dark':'light')}/>
      <div className="studio-layout">
        <AgentSidebar activeId={activeAgent.id} onSelect={setActiveAgent} searchQ={sidebarSearch} setSearchQ={setSidebarSearch}/>
        <ChatWindow agent={activeAgent} onVoiceCall={()=>setCall({type:'voice'})} onVideoCall={()=>setCall({type:'video'})}/>
        <StudioPanel onVideoCall={()=>setCall({type:'video'})}/>
      </div>
      <AnimatePresence>
        {call&&<CallOverlay key="call" type={call.type} agent={activeAgent} onEnd={()=>setCall(null)}/>}
      </AnimatePresence>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
